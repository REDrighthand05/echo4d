[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"
[project]
name = "echo4d"
version = "0.1.0"
description = "Calibrated RGB-D reconstruction with explicit observation provenance"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "Pillow>=10.1,<14", "scikit-image==0.25.2"]
[project.optional-dependencies]
test = ["pytest==8.4.2"]
[project.scripts]
echo4d = "echo4d.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"
