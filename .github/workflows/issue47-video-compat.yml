name: Issue47 B combined video and downstream contracts

on:
  pull_request:
    paths:
      - 'src/echo4d/video_sfm.py'
      - 'src/echo4d/video_pts.py'
      - 'tests/python/test_issue47_b_video.py'
      - 'tests/python/test_video_sfm_models.py'
      - 'tests/python/test_video_pts.py'
      - '.github/workflows/issue47-video-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  video-and-metric-bridge-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked environment
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: PTS, model selection, old trajectory, #17 and #23 regression
        run: |
          python -m pytest -q tests/python/test_issue47_b_video.py tests/python/test_video_pts.py tests/python/test_video_sfm_models.py tests/python/test_video_sfm.py tests/python/test_metric_anchor.py tests/python/test_metric_rgbd.py
