name: composable M2 real TUM known-pose graph

on:
  push:
    branches:
      - research/composable-graph-execution-m2-20261028
    paths:
      - 'tools/tum_composable_graph.py'
      - 'tools/tum_graph_holdout.py'
      - 'tools/tum_graph_projective_ab.py'
      - 'src/echo4d/projective_meshing.py'
      - 'src/echo4d/graph_runner.py'
      - 'src/echo4d/output.py'
      - 'tests/python/test_projective_meshing.py'
      - 'tests/python/test_tum_graph_projective_ab.py'
      - 'tests/python/test_tum_composable_graph.py'
      - 'tests/python/test_tum_graph_holdout.py'
      - '.github/workflows/tum-composable-graph.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: composable-real-tum-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pinned-real-tum-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked CPU dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Check split isolation and graph regression
        env:
          PYTHONPATH: tools
        run: |
          python -m pytest -q tests/python/test_tum_composable_graph.py tests/python/test_tum_graph_holdout.py tests/python/test_graph_runner.py tests/python/test_tum_graph_visual.py tests/python/test_projective_meshing.py tests/python/test_tum_graph_projective_ab.py
      - name: Execute real pinned public TUM graph
        env:
          ECHO_HEAD_SHA: ${{ github.sha }}
        run: |
          PYTHONPATH=tools python tools/tum_composable_graph.py \
            --work "$RUNNER_TEMP/echo-tum-graph" \
            --report-dir "$GITHUB_WORKSPACE/artifacts/tum-composable-graph"
      - name: Evaluate frozen 12 sensor holdouts (diagnostic, not surface GT)
        env:
          PYTHONPATH: tools
        run: |
          python tools/tum_graph_holdout.py \
            --full-manifest "$RUNNER_TEMP/echo-tum-graph/imported/recording.json" \
            --train-manifest "$RUNNER_TEMP/echo-tum-graph/imported/recording-train.json" \
            --mesh artifacts/tum-composable-graph/mesh.ply \
            --execution artifacts/tum-composable-graph/graph-execution.json \
            --report artifacts/tum-composable-graph/report.json \
            --output artifacts/tum-composable-graph/heldout-view-consistency.json
      - name: Execute independent projective triangles on identical TUM train split and score A/B
        env:
          PYTHONPATH: tools
        run: |
          python tools/tum_graph_projective_ab.py \
            --work "$RUNNER_TEMP/echo-tum-graph" \
            --baseline artifacts/tum-composable-graph \
            --alternative artifacts/tum-composable-graph/projective-alternative \
            --pixel-stride 4
      - name: Render three frozen RGB-aligned views and two free Mesh views (unreviewed)
        env:
          PYTHONPATH: tools
        run: |
          python tools/tum_graph_visual.py \
            --full-manifest "$RUNNER_TEMP/echo-tum-graph/imported/recording.json" \
            --train-manifest "$RUNNER_TEMP/echo-tum-graph/imported/recording-train.json" \
            --mesh artifacts/tum-composable-graph/mesh.ply \
            --execution artifacts/tum-composable-graph/graph-execution.json \
            --report artifacts/tum-composable-graph/report.json \
            --diagnostic artifacts/tum-composable-graph/heldout-view-consistency.json \
            --association "$RUNNER_TEMP/echo-tum-graph/imported/association.json" \
            --dataset-root "$RUNNER_TEMP/echo-tum-graph/dataset/rgbd_dataset_freiburg1_xyz" \
            --output artifacts/tum-composable-graph/visual
      - name: Report second-provider A/B as diagnostic only
        if: always()
        run: |
          if [ -f artifacts/tum-composable-graph/projective-alternative/ab-diagnostic.json ]; then
            python -c 'import json; d=json.load(open("artifacts/tum-composable-graph/projective-alternative/ab-diagnostic.json")); print("Two real algorithms, one fixed TUM 48/12 split; diagnostic only. TSDF RMSE(m):",d["tsdf"]["rmse_m"],"Projective RMSE(m):",d["projective"]["rmse_m"],"No independent surface truth or #74 PASS.")' >> "$GITHUB_STEP_SUMMARY"
          elif [ -f artifacts/tum-composable-graph/projective-alternative/ab-failure.json ]; then
            cat artifacts/tum-composable-graph/projective-alternative/ab-failure.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Report execution separately from quality
        if: always()
        run: |
          if [ -f artifacts/tum-composable-graph/SUMMARY.md ]; then
            cat artifacts/tum-composable-graph/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No execution report; inspect setup logs. No Mesh PASS." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/tum-composable-graph/heldout-view-consistency.json ]; then
            python -c 'import json; d=json.load(open("artifacts/tum-composable-graph/heldout-view-consistency.json")); s=d.get("diagnostic",{}); print("Sensor holdout diagnostic:",d["status"],"12-frame overlap coverage:",s.get("observed_depth_coverage","not_scored"),"RMSE(m):",s.get("rmse_m","not_scored"),"; NOT independent surface truth or #74 acceptance")' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve real receipt and Mesh only if produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composable-tum-graph-${{ github.run_id }}
          path: artifacts/tum-composable-graph/
          if-no-files-found: warn
          retention-days: 14
