name: Stanford 300 RGB eight measured depth only vs eight plus two RGB stereo
on:
  push:
    branches: [research/stanford-colmap300-eight-measured-control-20261030]
    paths:
      - tools/stanford_colmap_eight_measured_control.py
      - .github/workflows/stanford-colmap-eight-measured-control.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stanford-eight-measured-control
  cancel-in-progress: false
jobs:
  real-eight-measured-control:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download frozen original RGB and independently estimated COLMAP poses
        uses: actions/download-artifact@v4
        with:
          name: stanford-300rgb-early-overlap-30depth-40970565394
          run-id: 40970565394
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: REDrighthand05/echo4d
          path: artifacts/early-colmap
      - name: Download previous 8 measured plus 2 RGB stereo output as COMPARISON ONLY
        uses: actions/download-artifact@v4
        with:
          name: stanford-300rgb-four-depth-six-stereo-40994901644
          run-id: 40994901644
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: REDrighthand05/echo4d
          path: artifacts/stereo-comparison
      - name: Install pinned CPU geometry dependencies
        run: |
          python -m pip install 'open3d==0.19.0' 'trimesh==4.11.1' 'pillow==11.3.0' 'scipy==1.16.2' 'scikit-image==0.25.2' 'opencv-python-headless==4.12.0.88'
          python -m pip install --no-deps -e .
          python -m py_compile tools/stanford_colmap_eight_measured_control.py
          python tools/stanford_colmap_eight_measured_control.py --self-test
      - name: Re-fuse only eight original measured depth maps and render identical five views
        env:
          QT_QPA_PLATFORM: offscreen
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python tools/stanford_colmap_eight_measured_control.py \
            --upstream artifacts/early-colmap \
            --stereo-artifact artifacts/stereo-comparison \
            --output artifacts/eight-measured-control
      - name: Confirm real eight-depth Mesh and source-photo comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/eight-measured-control')
          r=json.loads((p/'receipt.json').read_text())
          assert r['status']=='REAL_MESH_GENERATED_VISUAL_REVIEW_REQUIRED',r
          assert r['input_rgb']==300 and r['registered_rgb']==287
          assert r['measured_depth_maps']==8 and r['predicted_depth_maps']==0
          assert len(r['measured_depth_samples'])==8
          assert len(r['stereo_replacement_samples'])==2
          assert len(r['same_ray_hit_percent']['measured8_only'])==5
          assert len(r['same_ray_hit_percent']['measured8_stereo2'])==5
          for name in ('measured8_only.glb','source-eight-only-vs-eight-plus-stereo-3plus2.png'):
              assert (p/name).stat().st_size>10000,name
          print(json.dumps(r,indent=2))
          PY
      - name: Preserve generated Mesh, five-view image and failure receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stanford-eight-measured-control-${{ github.run_id }}
          path: |
            artifacts/eight-measured-control/receipt.json
            artifacts/eight-measured-control/*.glb
            artifacts/eight-measured-control/*.png
          if-no-files-found: warn
          retention-days: 30
