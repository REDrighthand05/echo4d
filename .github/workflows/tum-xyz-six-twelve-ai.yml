name: TUM six measured plus twelve RGB AI depth real Mesh A/B
on:
  push:
    branches: [research/tum-xyz-six-measured-twelve-ai-20261030]
    paths:
      - tools/tum_xyz_six_measured_twelve_ai.py
      - .github/workflows/tum-xyz-six-twelve-ai.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tum-xyz-six-twelve-ai
  cancel-in-progress: false

jobs:
  real-tum-six-twelve:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing pinned CPU geometry stack
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install 'open3d==0.19.0' 'trimesh==4.11.1' 'pytest==8.4.2'
      - name: Validate existing measured-depth and AI calibration adapter
        env:
          PYTHONPATH: tools
        run: |
          python -m py_compile tools/tum_xyz_six_measured_twelve_ai.py
          python -m pytest -q tests/python/test_tum_xyz_six_da6_local.py
          python tools/tum_xyz_six_da6_local.py --self-test
      - name: Install same SHA-pinned CPU Depth Anything V2 Small as verified PR 167
        run: |
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.53.3' 'huggingface_hub==0.34.4'
      - name: Reconstruct actual TUM scene with six versus twelve RGB predictions
        env:
          PYTHONPATH: tools
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
          QT_QPA_PLATFORM: offscreen
          HF_HUB_DISABLE_XET: '1'
        run: |
          python tools/tum_xyz_six_measured_twelve_ai.py \
            --work "$RUNNER_TEMP/tum-xyz-six-twelve-ai" \
            --output "$GITHUB_WORKSPACE/artifacts/tum-xyz-six-twelve-ai"
      - name: Reopen both GLBs and verify three recorded plus two free views
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import trimesh
          p=Path('artifacts/tum-xyz-six-twelve-ai')
          r=json.loads((p/'result.json').read_text())
          assert r['status']=='TWO_REAL_MESHES_AND_FIVE_VIEWS_EXPORTED',r
          assert len(r['measured_indices'])==6
          assert len(r['old_rgb_only_indices'])==6
          assert len(r['added_rgb_only_indices'])==6
          assert len(set(r['measured_indices']+r['old_rgb_only_indices']+r['added_rgb_only_indices']))==18
          assert r['target_sensor_depth_read'] is False and r['mesh_prior'] is False
          assert r['target_sensor_depth_read_for_evaluation_only_after_mesh_export'] is True
          assert len(r['views'])==5 and len(r['withheld_sensor_evaluation_only'])==12
          for name in ('tum-six-measured-six-ai-local.glb','tum-six-measured-twelve-ai-local.glb'):
              mesh=trimesh.load(str(p/name),force='mesh',process=False)
              assert len(mesh.faces)>100 and mesh.visual.kind=='vertex'
          assert (p/'tum-six-vs-twelve-ai-five-views.png').stat().st_size>10000
          print('Two real color GLBs, 3 original photos, 2 free views exported')
          PY
      - name: Upload actual Meshes and visual evidence even on partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tum-six-twelve-ai-${{ github.run_id }}
          path: artifacts/tum-xyz-six-twelve-ai/
          if-no-files-found: warn
          retention-days: 30
