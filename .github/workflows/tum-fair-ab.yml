name: TUM same-48-12 known-vs-estimated pose A-B
on:
  pull_request:
    paths:
      - 'src/echo4d/metric_holdout.py'
      - 'tools/tum_fair_ab.py'
      - 'tests/python/test_tum_fair_ab.py'
      - '.github/workflows/tum-fair-ab.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tum-fair-ab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fair-A-B-same-measured-Z-and-scoring:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned real COLMAP and FFmpeg tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq colmap ffmpeg
          colmap help
      - name: Install ECHO pinned dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Verify A/B rigid gauge and exact evaluation contracts before real run
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/tools" python -m pytest tests/python/test_metric_holdout.py tests/python/test_tum_fair_ab.py -q
      - name: Real TUM SfM B mesh, then A GT mesh on identical RGB+depth and 12-view scoring
        env:
          ECHO_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/tools" python tools/tum_fair_ab.py \
            --work "$RUNNER_TEMP/tum-same-48-12-ab" \
            --report-dir "$GITHUB_WORKSPACE/artifacts/tum-fair-ab"
      - name: Display truthful machine summary on any result
        if: always()
        run: |
          if [ -f artifacts/tum-fair-ab/FAIR_AB_SUMMARY.md ]; then
            cat artifacts/tum-fair-ab/FAIR_AB_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No machine summary: see setup or pytest errors.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve A, B, original thresholds, raw FAIL and byte hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tum-fair-ab-${{ github.run_id }}
          path: |
            artifacts/tum-fair-ab/fair-ab-run.json
            artifacts/tum-fair-ab/fair-ab-comparison.json
            artifacts/tum-fair-ab/FAIR_AB_SUMMARY.md
            artifacts/tum-fair-ab/mesh-heldout-depth.json
            artifacts/tum-fair-ab/b-48train-12holdout.json
            artifacts/tum-fair-ab/metric/report.json
            artifacts/tum-fair-ab/metric/metric-trajectory-from-sensor.json
            artifacts/tum-fair-ab/mesh/report.json
            artifacts/tum-fair-ab/mesh/mesh.ply
            artifacts/tum-fair-ab/a-mesh/report.json
            artifacts/tum-fair-ab/a-mesh/mesh.ply
          if-no-files-found: warn
          retention-days: 14
