name: TUM RGB-guided local depth consensus MVS

on:
  push:
    branches:
      - research/plane-sweep-rgb-local-consensus-20261028
    paths:
      - 'src/echo4d/known_pose_depth_consensus.py'
      - 'tools/tum_plane_sweep.py'
      - 'tests/python/test_known_pose_depth_consensus.py'
      - '.github/workflows/tum-plane-sweep-rgb-consensus.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tum-plane-sweep-rgb-consensus-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-rgb-consensus:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked Echo4D and CPU OpenCV
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install --no-deps opencv-python-headless==4.12.0.88
      - name: Synthetic local consensus and existing MVS regressions
        run: |
          python -m pytest -q tests/python/test_known_pose_depth_consensus.py tests/python/test_known_pose_plane_sweep.py tests/python/test_known_pose_plane_sweep_adaptive.py tests/python/test_known_pose_mvs_sources.py
      - name: Real TUM known-pose MVS RGB consensus to Mesh
        env:
          PYTHONPATH: tools
        run: |
          python tools/tum_plane_sweep.py \
            --work "$RUNNER_TEMP/tum-plane-sweep-rgb-consensus" \
            --report-dir "$GITHUB_WORKSPACE/artifacts/tum-plane-sweep-rgb-consensus" \
            --max-anchors 48 --max-sources 4 --planes 64 --pairing top2 \
            --source-visibility --visibility-mode soft --window-mode adaptive \
            --depth-regularization rgb-consensus
      - name: Preserve actual Mesh, five views, original input hashes and FAIL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tum-plane-sweep-rgb-consensus-${{ github.run_id }}
          path: artifacts/tum-plane-sweep-rgb-consensus/
          if-no-files-found: warn
          retention-days: 14
