name: TUM fair A/B 48-12 measured-depth mesh
on:
  pull_request:
    paths:
      - 'tools/tum_fair_ab_mesh.py'
      - 'tests/python/test_tum_fair_ab_mesh.py'
      - '.github/workflows/tum-fair-ab-mesh.yml'
      - 'tools/tum_sensor_mesh_holdout.py'
      - 'src/echo4d/holdout.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tum-fair-ab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  same-input-A-B:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install actual FFmpeg and CPU COLMAP
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg colmap
          colmap help > /dev/null
      - name: Install locked Python dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Unit and holdout-leakage tests
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/tools" python -m pytest \
            tests/python/test_tum_fair_ab_mesh.py \
            tests/python/test_tum_sensor_mesh_holdout.py \
            tests/python/test_holdout.py -q
      - name: Execute frozen B sensor-scaled SfM Mesh first, then A GT-pose comparison
        env:
          ECHO_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/tools" python tools/tum_fair_ab_mesh.py \
            --work "$RUNNER_TEMP/tum-fair-ab-work" \
            --report-dir "$GITHUB_WORKSPACE/artifacts/tum-fair-ab"
      - name: Display PASS or FAIL without hiding missing results
        if: always()
        run: |
          if test -f artifacts/tum-fair-ab/A_B_SUMMARY.md; then
            cat artifacts/tum-fair-ab/A_B_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No A/B report produced; see logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload original A and B machine evidence and meshes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tum-fair-A-B-${{ github.run_id }}
          path: |
            artifacts/tum-fair-ab/A_B_report.json
            artifacts/tum-fair-ab/A_B_metrics.json
            artifacts/tum-fair-ab/A_B_SUMMARY.md
            artifacts/tum-fair-ab/b-48train-12holdout.json
            artifacts/tum-fair-ab/holdout-depth-comparison.json
            artifacts/tum-fair-ab/metric/report.json
            artifacts/tum-fair-ab/metric/metric-trajectory-from-sensor.json
            artifacts/tum-fair-ab/mesh/report.json
            artifacts/tum-fair-ab/mesh/mesh.ply
            artifacts/tum-fair-ab/A-GT-pose-mesh/report.json
            artifacts/tum-fair-ab/A-GT-pose-mesh/mesh.ply
            artifacts/tum-fair-ab/A-GT-pose-mesh/scene.echo.json
          if-no-files-found: warn
          retention-days: 14
