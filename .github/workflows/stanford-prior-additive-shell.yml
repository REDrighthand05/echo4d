name: Stanford observed-first existing scan shell real A-B
on:
  push:
    branches: [research/stanford-observed-prior-shell-20261029]
    paths:
      - tools/stanford_prior_additive_shell.py
      - tests/python/test_stanford_prior_additive_shell.py
      - .github/workflows/stanford-prior-additive-shell.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  observed-first:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install stock real-scene stack
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
          pip install 'open3d==0.19.0' 'trimesh>=4,<5'
      - name: Test shell/furniture geometry safeguards
        env:
          PYTHONPATH: tools:tests/python
        run: |
          python -m pytest -q tests/python/test_stanford_observed_prior_shell.py tests/python/test_stanford_prior_additive_shell.py
      - name: Real measured geometry FIRST, only missing PRE-EXISTING shell
        env:
          PYTHONPATH: tools
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python tools/stanford_prior_additive_shell.py \
            --observed docs/real-room-review/stanford-lounge-native-planar/OBSERVED-plus-INFERRED.glb \
            --prior docs/real-room-review/stanford-lounge-second-room/PREEXISTING-PRIOR-RGB.glb \
            --observed-report docs/real-room-review/stanford-lounge-native-planar/result.json \
            --prior-report docs/real-room-review/stanford-lounge-second-room/result.json \
            --output artifacts/stanford-additive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stanford-additive-geometry-${{ github.run_id }}
          path: artifacts/stanford-additive/
          retention-days: 14
      - name: Render actual 3 recorded photos and 2 room-scale free views
        env:
          PYTHONPATH: tools
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python tools/stanford_hybrid_real_views.py \
            --observed docs/real-room-review/stanford-lounge-native-planar/OBSERVED-plus-INFERRED.glb \
            --observed-report docs/real-room-review/stanford-lounge-native-planar/result.json \
            --output artifacts/stanford-additive \
            --cache "$RUNNER_TEMP/stanford-lounge"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stanford-additive-real-3plus2-${{ github.run_id }}
          path: artifacts/stanford-additive/
          retention-days: 14
      - name: Publish actual GLB and five images without force or rebase
        run: |
          set -e
          branch=research/stanford-observed-prior-shell-20261029
          git fetch origin "$branch"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$branch")"
          dest=docs/real-room-review/stanford-lounge-additive-shell
          mkdir -p "$dest"
          cp artifacts/stanford-additive/*.glb artifacts/stanford-additive/result.json "$dest/"
          cp -r artifacts/stanford-additive/three-real-two-free "$dest/"
          git config user.name "echo4d-real-room-ci"
          git config user.email "echo4d-real-room-ci@users.noreply.github.com"
          git add "$dest"
          if ! git diff --cached --quiet; then
            git commit -m "results(real-room): preserve observed Stanford geometry and add only unsupported prior shell"
            git push origin "HEAD:refs/heads/$branch"
          fi
