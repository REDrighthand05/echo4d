name: TUM held-out depth generalization

on:
  pull_request:
    paths:
      - 'src/echo4d/holdout.py'
      - 'tests/python/test_holdout.py'
      - 'tools/tum_heldout.py'
      - '.github/workflows/tum-heldout.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tum-heldout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  out-of-fit-real-depth:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies and checkout code
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Validate independent analytic rasterizer and negative controls
        run: python -m pytest tests/python/test_holdout.py -q
      - name: Download pinned real TUM data, fuse only training frames, score 12 withheld views
        env:
          ECHO_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/tum_heldout.py \
            --work "$RUNNER_TEMP/echo4d-tum-heldout" \
            --report-dir "$GITHUB_WORKSPACE/artifacts/tum-heldout"
      - name: Persist experiment report as GitHub run summary even on failure
        if: always()
        run: |
          if [ -f artifacts/tum-heldout/SUMMARY.md ]; then
            cat artifacts/tum-heldout/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No experiment report was written; inspect preceding logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload evidence, diagnostics and mesh, including failure reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tum-heldout-depth-${{ github.run_id }}
          path: artifacts/tum-heldout/
          if-no-files-found: warn
          retention-days: 14
