name: TUM real high-information Open3D sparse TSDF geometry

on:
  push:
    branches:
      - research/highres-rgbd-tsdf-quality-20261028
    paths:
      - 'tools/sparse_open3d_fusion.py'
      - 'tools/tum_sparse_open3d.py'
      - 'tests/python/test_sparse_open3d.py'
      - '.github/workflows/tum-sparse-open3d-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tum-sparse-open3d-geometry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-sparse-mesh:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked ECHO and optional pinned Open3D CPU geometry engine
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install 'open3d==0.19.0'
      - name: Test real sparse engine on synthetic geometry and exclusions
        env:
          PYTHONPATH: tools
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m pytest -q tests/python/test_sparse_open3d.py tests/python/test_tum_highres_tsdf.py
      - name: Reconstruct real 320 dense versus 640 sparse color Mesh and render 3+2 views
        env:
          PYTHONPATH: tools
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python tools/tum_sparse_open3d.py \
            --work "$RUNNER_TEMP/tum-sparse-geometry" \
            --report-dir "$GITHUB_WORKSPACE/artifacts/tum-sparse-geometry"
      - name: Summarize actual result or failure
        if: always()
        run: |
          if [ -f artifacts/tum-sparse-geometry/SUMMARY.md ]; then
            cat artifacts/tum-sparse-geometry/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain actual Meshes and 3+2 RGB comparisons or failure receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tum-sparse-geometry-${{ github.run_id }}
          path: artifacts/tum-sparse-geometry/
          if-no-files-found: warn
          retention-days: 14
