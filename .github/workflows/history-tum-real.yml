name: Real historical video + RGB-D to Mesh (TUM 640p)

on:
  pull_request:
    paths:
      - 'tools/tum_history_real_scene.py'
      - '.github/workflows/history-tum-real.yml'
      - 'src/echo4d/history.py'
      - 'src/echo4d/history_rgbd.py'
      - 'tests/python/test_history_rgbd.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: echo-history-tum-real-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-640p-history-to-mesh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Record actual tested checkout
        run: echo "ECHO_TESTED_CHECKOUT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install FFmpeg decoder
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          ffmpeg -hide_banner -encoders | grep libvpx-vp9
          ffprobe -version | head -n 1
      - name: Install locked ECHO reconstruction core
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Verify encoded video and measured depth pose contract
        run: python -m pytest tests/python/test_history.py tests/python/test_history_rgbd.py -q
      - name: Download pinned real TUM RGB-D and produce historical Mesh
        env:
          ECHO_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/tum_history_real_scene.py \
            --work "$RUNNER_TEMP/echo-history-tum-fullres" \
            --report-dir "$GITHUB_WORKSPACE/artifacts/history-tum-real"
      - name: Report results, including failures
        if: always()
        run: |
          echo "Tested checkout: $ECHO_TESTED_CHECKOUT_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/history-tum-real/SUMMARY.md ]; then
            cat artifacts/history-tum-real/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No real-data report produced; see runner logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain real RGB, Mesh and 3+2 review views
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-real-tum-640p-${{ github.run_id }}
          path: |
            artifacts/history-tum-real/real-history-report.json
            artifacts/history-tum-real/SUMMARY.md
            artifacts/history-tum-real/views/*.png
            artifacts/history-tum-real/mesh.ply
            artifacts/history-tum-real/scene.echo.json
          if-no-files-found: warn
          retention-days: 14
