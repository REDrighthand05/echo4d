name: Stanford 3000-frame coherent far-depth TSDF A/B
on:
  push:
    branches: [research/stanford-far-depth-coherence-20261030]
    paths:
      - tools/stanford_far_depth_refusion.py
      - .github/workflows/stanford-far-depth-refusion.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-far-depth-refusion:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: isl-org/Open3D
          ref: 1e7b17438687a0b0c1e5a7187321ac7044afe275
          path: vendor/Open3D
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real TSDF integration and rendering dependencies
        run: |
          python -m pip install 'open3d==0.19.0' 'trimesh==4.11.1' 'numpy<3' pillow
          curl -fLsS 'https://raw.githubusercontent.com/REDrighthand05/echo4d/1a487a33592e08dde351047583ff3603804f9f1e/tools/stanford_full_observed_speck_cleanup.py' -o tools/stanford_full_observed_speck_cleanup.py
          python -m py_compile tools/stanford_far_depth_refusion.py tools/stanford_full_observed_speck_cleanup.py
      - name: Download completed observed baseline, never use its mesh as prior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40877823227 --repo "$GITHUB_REPOSITORY" --name official-room-recovered-40877823227 --dir "$RUNNER_TEMP/full-room"
          test -s "$RUNNER_TEMP/full-room/scene/integrated.ply"
          test -s "$RUNNER_TEMP/full-room/scene/trajectory.log"
          test -s "$RUNNER_TEMP/full-room/views/recorded-00000.png"
      - name: Download completed unfiltered 4.5m real Mesh visual baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40918365557 --repo "$GITHUB_REPOSITORY" --name stanford-far-depth-refusion-40918365557 --dir "$RUNNER_TEMP/prior45"
          test -s "$RUNNER_TEMP/prior45/five-view-far-depth-ab.png"
          test -s "$RUNNER_TEMP/prior45/receipt.json"
      - name: Re-integrate all 3000 measured frames with far-depth spatial coherence
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python tools/stanford_far_depth_refusion.py \
            --source "$RUNNER_TEMP/full-room" \
            --upstream vendor/Open3D \
            --prior "$RUNNER_TEMP/prior45" \
            --output artifacts/stanford-far-depth-refusion
      - name: Preserve real GLBs and same-ray five-view images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stanford-far-depth-coherence-${{ github.run_id }}
          path: artifacts/stanford-far-depth-refusion/
          retention-days: 30
          if-no-files-found: warn
