name: TUM sensor metric B-path real mesh
on:
  pull_request:
    paths:
      - 'src/echo4d/metric_rgbd.py'
      - 'tests/python/test_metric_rgbd.py'
      - 'tests/python/test_tum_sensor_metric_mesh.py'
      - 'tests/python/test_metric_holdout.py'
      - 'src/echo4d/metric_holdout.py'
      - 'src/echo4d/holdout.py'
      - 'tools/tum_sensor_metric_mesh.py'
      - '.github/workflows/tum-sensor-metric-mesh.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tum-sensor-metric-mesh-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-B-path-sensor-depth-to-TSDF:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install real CPU COLMAP and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq colmap ffmpeg
          colmap help
      - name: Install Echo4D dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Check B-path isolation and fixed split contracts
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/tools" python -m pytest tests/python/test_metric_rgbd.py tests/python/test_tum_sensor_metric_mesh.py tests/python/test_metric_holdout.py -q
      - name: Run real pinned TUM source RGB SfM, sensor scale, 48-frame TSDF
        env:
          ECHO_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/tum_sensor_metric_mesh.py \
            --work "$RUNNER_TEMP/tum-sensor-metric-mesh" \
            --report-dir "$GITHUB_WORKSPACE/artifacts/tum-sensor-metric-mesh"
      - name: Publish honest summary even on failures
        if: always()
        run: |
          if [ -f artifacts/tum-sensor-metric-mesh/SUMMARY.md ]; then
            cat artifacts/tum-sensor-metric-mesh/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary generated; inspect setup failure." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain original machine reports and mesh only if actually produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tum-sensor-metric-mesh-${{ github.run_id }}
          path: |
            artifacts/tum-sensor-metric-mesh/report.json
            artifacts/tum-sensor-metric-mesh/SUMMARY.md
            artifacts/tum-sensor-metric-mesh/b-48train-12holdout.json
            artifacts/tum-sensor-metric-mesh/metric/*.json
            artifacts/tum-sensor-metric-mesh/mesh-heldout-depth.json
            artifacts/tum-sensor-metric-mesh/mesh/report.json
            artifacts/tum-sensor-metric-mesh/mesh/mesh.ply
            artifacts/tum-sensor-metric-mesh/mesh/scene.echo.json
            artifacts/tum-sensor-metric-mesh/mesh/evidence.npz
          if-no-files-found: warn
          retention-days: 14
