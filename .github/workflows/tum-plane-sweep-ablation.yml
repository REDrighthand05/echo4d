name: TUM known-pose CPU plane-sweep MVS ablation

on:
  push:
    branches:
      - research/rgb-stereo-multiview-consensus-20261028
    paths:
      - 'src/echo4d/known_pose_plane_sweep.py'
      - 'tools/tum_plane_sweep.py'
      - 'tests/python/test_known_pose_plane_sweep.py'
      - '.github/workflows/tum-plane-sweep-ablation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tum-plane-sweep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-plane-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked Echo4D and CPU OpenCV
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install --no-deps opencv-python-headless==4.12.0.88
      - name: Synthetic oracle and negative cases
        run: python -m pytest -q tests/python/test_known_pose_plane_sweep.py
      - name: Real TUM known-pose RGB plane sweep to Mesh
        env:
          PYTHONPATH: tools
        run: |
          python tools/tum_plane_sweep.py \
            --work "$RUNNER_TEMP/tum-plane-sweep" \
            --report-dir "$GITHUB_WORKSPACE/artifacts/tum-plane-sweep" \
            --max-anchors 20 --planes 64
      - name: Preserve Mesh, five views and honest failure receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tum-plane-sweep-${{ github.run_id }}
          path: artifacts/tum-plane-sweep/
          if-no-files-found: warn
          retention-days: 14
