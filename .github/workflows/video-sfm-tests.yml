name: video SfM contract tests
on:
  pull_request:
    paths:
      - 'src/echo4d/video_sfm.py'
      - 'tests/python/test_video_sfm.py'
      - 'docs/VIDEO_SFM.md'
      - '.github/workflows/video-sfm-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  negative-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest tests/python/test_video_sfm.py -q
