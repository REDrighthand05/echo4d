name: TUM desk local narrow-edge TSDF real Mesh A/B

on:
  push:
    branches:
      - research/highres-rgbd-tsdf-quality-20261028
    paths:
      - 'tools/tum_desk_sparse_quality.py'
      - 'tools/sparse_open3d_fusion.py'
      - 'tests/python/test_sparse_open3d.py'
      - 'tests/python/test_tum_desk_sparse_quality.py'
      - '.github/workflows/tum-desk-local-truncation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tum-desk-local-edge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-local-tsdf-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked project and Open3D
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install 'open3d==0.19.0'
      - name: Run local TSDF masks and selection regression
        env:
          PYTHONPATH: tools
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m pytest -q tests/python/test_tum_desk_sparse_quality.py tests/python/test_sparse_open3d.py
      - name: Fuse real 640x480 TUM desk 96-frame wide vs local-edge Meshes
        env:
          PYTHONPATH: tools
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python tools/tum_desk_sparse_quality.py \
            --local-truncation \
            --work "$RUNNER_TEMP/tum-desk-local-edge" \
            --report-dir "$GITHUB_WORKSPACE/artifacts/tum-desk-local-edge"
      - name: Surface real Mesh result or failure
        if: always()
        run: |
          if [ -f artifacts/tum-desk-local-edge/SUMMARY.md ]; then
            cat artifacts/tum-desk-local-edge/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain two real colored Meshes and three plus two comparison views
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tum-desk-local-edge-${{ github.run_id }}
          path: artifacts/tum-desk-local-edge/
          if-no-files-found: warn
          retention-days: 14
