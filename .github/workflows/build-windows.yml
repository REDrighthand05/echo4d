name: build-windows-exe

on:
  workflow_dispatch:
  push:
    branches: [main, product/echo-scene]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-app.txt pyinstaller huggingface_hub
      - name: Fetch ffmpeg (static Windows builds for the exe bundle)
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg-essentials.zip
          Expand-Archive -Path ffmpeg-essentials.zip -DestinationPath ffmpeg-essentials -Force
          $bin = Get-ChildItem -Path ffmpeg-essentials -Recurse -Directory -Filter bin | Select-Object -First 1
          if (-not $bin) { throw "ffmpeg zip layout unexpected: no bin directory found" }
          New-Item -ItemType Directory -Force assets/ffmpeg
          Copy-Item (Join-Path $bin.FullName "ffmpeg.exe") assets/ffmpeg/ffmpeg.exe
          Copy-Item (Join-Path $bin.FullName "ffprobe.exe") assets/ffmpeg/ffprobe.exe
          Get-Item assets/ffmpeg/ffmpeg.exe, assets/ffmpeg/ffprobe.exe | Select-Object Name, Length
      - name: Fetch depth model (Base, hash-verified)
        run: |
          python -c "from huggingface_hub import hf_hub_download; hf_hub_download('onnx-community/depth-anything-v2-base', 'onnx/model.onnx', local_dir='models_tmp')"
          New-Item -ItemType Directory -Force models
          Copy-Item models_tmp/onnx/model.onnx models/depth_anything_v2_base.onnx
          $f = Get-Item models/depth_anything_v2_base.onnx
          if ($f.Length -ne 388917010) { throw "Base model size mismatch: $($f.Length)" }
          $h = (Get-FileHash models/depth_anything_v2_base.onnx -Algorithm SHA256).Hash.ToLower()
          if ($h -ne "dab40f67d5ead5e0ed52acfae41a717a708b02bc57f6cb761c5de828f26a7289") { throw "Base model SHA-256 mismatch: $h" }
          Write-Host "Base model verified: $($f.Length) bytes, sha256 $h"
        env:
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
      - name: Build exe
        run: pyinstaller echo-scene.spec --noconfirm
      - name: Package
        run: Compress-Archive -Path dist/EchoScene -DestinationPath EchoScene-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: EchoScene-windows
          path: EchoScene-windows.zip
          retention-days: 30
