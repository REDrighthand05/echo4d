name: build-windows-exe

on:
  workflow_dispatch:
  push:
    branches: [main, product/echo-scene]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-app.txt pyinstaller huggingface_hub
      - name: Resolve installer version
        id: ver
        shell: pwsh
        run: |
          # Single source of truth: the release tag (vX.Y.Z) when this
          # build runs from one, else installer/version.inc.
          if ("${{ github.ref_name }}" -match '^v(\d+\.\d+\.\d+)$') {
            $ver = $Matches[1]
          } else {
            $line = Get-Content installer/version.inc |
              Where-Object { $_ -match '#define AppVersion "' } |
              Select-Object -First 1
            if (-not $line) { throw "AppVersion not found in installer/version.inc" }
            $ver = [regex]::Match($line, '"([0-9.]+)"').Groups[1].Value
          }
          "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Installer version: $ver"
      - name: Fetch ffmpeg (static Windows builds for the exe bundle)
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg-essentials.zip
          Expand-Archive -Path ffmpeg-essentials.zip -DestinationPath ffmpeg-essentials -Force
          $bin = Get-ChildItem -Path ffmpeg-essentials -Recurse -Directory -Filter bin | Select-Object -First 1
          if (-not $bin) { throw "ffmpeg zip layout unexpected: no bin directory found" }
          New-Item -ItemType Directory -Force assets/ffmpeg
          Copy-Item (Join-Path $bin.FullName "ffmpeg.exe") assets/ffmpeg/ffmpeg.exe
          Copy-Item (Join-Path $bin.FullName "ffprobe.exe") assets/ffmpeg/ffprobe.exe
          Get-Item assets/ffmpeg/ffmpeg.exe, assets/ffmpeg/ffprobe.exe | Select-Object Name, Length
      - name: Fetch depth model (Base, hash-verified)
        run: |
          python -c "from huggingface_hub import hf_hub_download; hf_hub_download('onnx-community/depth-anything-v2-base', 'onnx/model.onnx', local_dir='models_tmp')"
          New-Item -ItemType Directory -Force models
          Copy-Item models_tmp/onnx/model.onnx models/depth_anything_v2_base.onnx
          $f = Get-Item models/depth_anything_v2_base.onnx
          if ($f.Length -ne 388917010) { throw "Base model size mismatch: $($f.Length)" }
          $h = (Get-FileHash models/depth_anything_v2_base.onnx -Algorithm SHA256).Hash.ToLower()
          if ($h -ne "dab40f67d5ead5e0ed52acfae41a717a708b02bc57f6cb761c5de828f26a7289") { throw "Base model SHA-256 mismatch: $h" }
          Write-Host "Base model verified: $($f.Length) bytes, sha256 $h"
        env:
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
      - name: Clean payload caches
        # The loose app payload is copied into the bundle as-is;
        # stale bytecode caches must not ride along (they would
        # also poison the update manifest with per-build noise).
        run: |
          Get-ChildItem -Path echo_scene, echo_app, echo_super, web_ui -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
      - name: Build exe
        run: pyinstaller echo-scene-web.spec --noconfirm
      - name: Verify mesh dependency (open3d) is inside the frozen bundle
        # Regression guard for the v0.1 breakage: the exe built green
        # while open3d was missing, and only failed on the user's
        # machine at the mesh stage. Fail the build instead if the
        # frozen tree does not carry the library and its native module.
        run: |
          $o3d = "dist/EchoScene/open3d"
          if (-not (Test-Path $o3d)) { throw "open3d package missing from frozen bundle: $o3d" }
          $pyd = Get-ChildItem -Path $o3d -Recurse -Filter *.pyd | Select-Object -First 1
          if (-not $pyd) { throw "open3d native extension (*.pyd) missing from frozen bundle" }
          Write-Host "open3d bundled OK: $($pyd.FullName)"
      - name: Verify clean-stage dependency (scipy) is inside the frozen bundle
        # v0.2: the continuity-cleanup stage (echo_scene/clean.py) runs
        # scipy connected components behind a lazy import -- the same
        # silent-missing failure mode as open3d in v0.1. Guard it the
        # same way.
        run: |
          $sp = "dist/EchoScene/scipy"
          if (-not (Test-Path $sp)) { throw "scipy package missing from frozen bundle: $sp" }
          $pyd = Get-ChildItem -Path $sp -Recurse -Filter *.pyd | Select-Object -First 1
          if (-not $pyd) { throw "scipy native extension (*.pyd) missing from frozen bundle" }
          Write-Host "scipy bundled OK: $($pyd.FullName)"
      - name: Build update manifest
        # The manifest is the hot-update ledger: every file in the
        # finished tree, hashed. It is embedded into the install
        # (.echo/manifest.json) BEFORE packaging so a fresh install
        # starts with the truth, and uploaded as a release asset so
        # the NEXT release can diff against it.
        run: |
          python tools/build_manifest.py dist/EchoScene "${{ steps.ver.outputs.version }}" echoscene-manifest.json
      - name: Build update pack (best effort)
        # Diff against the latest published release's manifest.
        # No previous manifest (v0.4 is the first) or base files
        # changed -> no pack, installer-only release; never fatal.
        shell: pwsh
        run: |
          $prev = "prev-manifest"
          New-Item -ItemType Directory -Force $prev | Out-Null
          gh release download --pattern echoscene-manifest.json --dir $prev
          if (Test-Path "$prev/echoscene-manifest.json") {
            python tools/build_update_pack.py "$prev/echoscene-manifest.json" dist/EchoScene echoscene-manifest.json EchoScene-Update.zip
            if ($LASTEXITCODE -eq 3) { Write-Host "no pack: base files changed" }
          } else { Write-Host "no previous manifest: pack skipped" }
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: EchoScene-manifest
          path: echoscene-manifest.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: hashFiles('EchoScene-Update.zip') != ''
        with:
          name: EchoScene-update-pack
          path: EchoScene-Update.zip
          retention-days: 30
      - name: Package
        run: Compress-Archive -Path dist/EchoScene -DestinationPath EchoScene-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: EchoScene-windows
          path: EchoScene-windows.zip
          retention-days: 30
      # --- Installer (Inno Setup) -------------------------------------
      # The zip above stays as the portable option; the setup exe is the
      # primary route (per-user, no admin, Start-menu entry, upgrade in
      # place, clean uninstall -- see installer/README.md). Payload is
      # the same dist/EchoScene folder the zip is made from.
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after Inno Setup install: $iscc" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\EchoScene.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed with exit code $LASTEXITCODE" }
          $setup = Get-Item EchoScene-Setup.exe
          Write-Host "Installer built: $($setup.FullName) ($($setup.Length) bytes)"
      - uses: actions/upload-artifact@v4
        with:
          name: EchoScene-setup
          path: EchoScene-Setup.exe
          retention-days: 30
