name: Stanford 300 RGB four measured depth plus six CPU stereo depths
on:
  push:
    branches: [research/stanford-colmap300-four-depth-six-stereo-20261030]
    paths:
      - tools/stanford_colmap_stereo6.py
      - .github/workflows/stanford-colmap-stereo6.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stanford-colmap-stereo6
  cancel-in-progress: false
jobs:
  real-four-measured-six-inferred:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve frozen original Stanford 300 RGB and independent COLMAP poses
        uses: actions/download-artifact@v4
        with:
          name: stanford-300rgb-early-overlap-30depth-40970565394
          run-id: 40970565394
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: REDrighthand05/echo4d
          path: artifacts/early-colmap
      - name: Install CPU reconstruction and existing RGB stereo module
        run: |
          python -m pip install 'open3d==0.19.0' 'trimesh==4.11.1' 'pillow==11.3.0' 'scipy==1.16.2' 'scikit-image==0.25.2' 'opencv-python-headless==4.12.0.88'
          python -m pip install --no-deps -e .
          python -m py_compile tools/stanford_colmap_stereo6.py
          python tools/stanford_colmap_stereo6.py --self-test
      - name: Re-fuse ten measured versus four measured and six RGB-inferred depths
        env:
          QT_QPA_PLATFORM: offscreen
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python tools/stanford_colmap_stereo6.py \
            --upstream artifacts/early-colmap \
            --output artifacts/stanford-colmap-stereo6
      - name: Confirm real Mesh outputs and strict input reduction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/stanford-colmap-stereo6')
          r=json.loads((p/'receipt.json').read_text())
          print(json.dumps({k:r.get(k) for k in (
              'status','selected_rgb','registered_rgb',
              'baseline_measured_depth_maps','hybrid_measured_depth_maps',
              'actual_inferred_depth_maps','same_ray_hit_percent')},indent=2))
          assert r['status']=='REAL_MESH_GENERATED_VISUAL_REVIEW_REQUIRED'
          assert r['selected_rgb']==300 and r['registered_rgb']==287
          assert r['baseline_measured_depth_maps']==10
          assert r['hybrid_measured_depth_maps']==4
          assert r['actual_inferred_depth_maps']==6
          assert r['intermediate_measured_depth_maps']==8
          assert r['intermediate_inferred_depth_maps']==2
          assert len(r['inferred_frames'])==6
          for name in ('measured10.glb','measured4_stereo6.glb',
                       'source-measured10-vs-measured4-stereo6-3plus2.png',
                       'measured8_stereo2.glb',
                       'source-measured10-vs-measured8-stereo2-3plus2.png'):
              assert (p/name).stat().st_size>10000,name
          assert all(len(r['same_ray_hit_percent'][n])==5
                     for n in ('measured10','measured4_stereo6','measured8_stereo2'))
          PY
      - name: Preserve actual geometry or failure receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stanford-300rgb-four-depth-six-stereo-${{ github.run_id }}
          path: |
            artifacts/stanford-colmap-stereo6/receipt.json
            artifacts/stanford-colmap-stereo6/*.glb
            artifacts/stanford-colmap-stereo6/*.png
          if-no-files-found: warn
          retention-days: 30
