name: TUM desk V2 source-paired 48-train 12-holdout sensor mesh
on:
  pull_request:
    paths:
      - 'tools/tum_desk_full_mesh.py'
      - 'tools/desk_source_cohort.py'
      - 'tests/python/test_desk_source_cohort.py'
      - 'tests/python/test_tum_desk_full_mesh.py'
      - '.github/workflows/tum-desk-full-mesh.yml'
      - 'docs/DESK_FULL_MESH.md'
      - 'tools/tum_desk_sfm.py'
      - 'src/echo4d/metric_anchor.py'
      - 'src/echo4d/metric_rgbd.py'
      - 'src/echo4d/metric_holdout.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desk-metric-mesh-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desk-frozen-dense-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Record actual tested checkout
        run: echo "ECHO_TESTED_CHECKOUT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Initialize immutable checkout and runner receipt
        env:
          ECHO_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p artifacts/tum-desk-full-mesh
          printf 'actual_checkout_sha=%s\nhead_sha=%s\n' "$ECHO_TESTED_CHECKOUT_SHA" "$ECHO_HEAD_SHA" > artifacts/tum-desk-full-mesh/setup-identity.txt
          date -u '+runner_start_utc=%Y-%m-%dT%H:%M:%SZ' >> artifacts/tum-desk-full-mesh/setup-identity.txt
          uname -a > artifacts/tum-desk-full-mesh/runner-uname.txt
          cat /etc/os-release > artifacts/tum-desk-full-mesh/runner-os-release.txt
      - name: Refresh apt package index (independent deadline)
        id: apt_update
        timeout-minutes: 12
        shell: bash
        run: |
          set -o pipefail
          # The fixed V2 run 40336531110 timed out fetching packages from
          # azure.archive.ubuntu.com, before any dataset/geometry work began.
          # Use Ubuntu's official public mirror, without changing versions.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          grep -hE '^(URIs:|Suites:|Components:|deb )' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null | tee artifacts/tum-desk-full-mesh/apt-sources.txt || true
          date -u '+apt_update_begin_utc=%Y-%m-%dT%H:%M:%SZ' | tee -a artifacts/tum-desk-full-mesh/apt-timings.txt
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update 2>&1 | tee artifacts/tum-desk-full-mesh/apt-update.log
          date -u '+apt_update_end_utc=%Y-%m-%dT%H:%M:%SZ' | tee -a artifacts/tum-desk-full-mesh/apt-timings.txt
      - name: Install CPU COLMAP and FFmpeg (independent deadline)
        id: apt_install
        timeout-minutes: 18
        shell: bash
        run: |
          set -o pipefail
          date -u '+apt_install_begin_utc=%Y-%m-%dT%H:%M:%SZ' | tee -a artifacts/tum-desk-full-mesh/apt-timings.txt
          # Hosted runners may already include FFmpeg; avoid re-downloading
          # its large codec dependency tree. Still require the real executable.
          if command -v ffmpeg >/dev/null 2>&1; then
            echo 'Using preinstalled FFmpeg' | tee artifacts/tum-desk-full-mesh/ffmpeg-install-source.txt
            packages=(colmap)
          else
            echo 'Installing FFmpeg with COLMAP' | tee artifacts/tum-desk-full-mesh/ffmpeg-install-source.txt
            packages=(colmap ffmpeg)
          fi
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends "${packages[@]}" 2>&1 | tee artifacts/tum-desk-full-mesh/apt-install.log
          date -u '+apt_install_end_utc=%Y-%m-%dT%H:%M:%SZ' | tee -a artifacts/tum-desk-full-mesh/apt-timings.txt
          colmap help > artifacts/tum-desk-full-mesh/colmap-help.txt
          ffmpeg -version > artifacts/tum-desk-full-mesh/ffmpeg-version.txt
          dpkg-query -W colmap > artifacts/tum-desk-full-mesh/installed-versions.txt
          dpkg-query -W ffmpeg >> artifacts/tum-desk-full-mesh/installed-versions.txt 2>&1 || echo 'FFmpeg executable not owned by an apt package' >> artifacts/tum-desk-full-mesh/installed-versions.txt
      - name: Install locked source and test dependencies
        id: python_deps
        timeout-minutes: 12
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Assert frozen desk roles and fail-closed pairing
        id: frozen_contract
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/tools" python -m pytest -q tests/python/test_tum_desk_full_mesh.py
      - name: Download pre-pinned desk and run RGB SfM through physical-sensor Mesh scoring
        id: desk_experiment
        env:
          ECHO_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/tum_desk_full_mesh.py \
            --cohort v2-source-paired \
            --work "$RUNNER_TEMP/tum-desk-full-mesh" \
            --report-dir "$GITHUB_WORKSPACE/artifacts/tum-desk-full-mesh"
      - name: Record phase outcomes even if apt never completes
        if: always()
        env:
          APT_UPDATE_OUTCOME: ${{ steps.apt_update.outcome }}
          APT_INSTALL_OUTCOME: ${{ steps.apt_install.outcome }}
          PYTHON_DEPS_OUTCOME: ${{ steps.python_deps.outcome }}
          FROZEN_CONTRACT_OUTCOME: ${{ steps.frozen_contract.outcome }}
          DESK_EXPERIMENT_OUTCOME: ${{ steps.desk_experiment.outcome }}
          ECHO_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p artifacts/tum-desk-full-mesh
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          target = Path("artifacts/tum-desk-full-mesh")
          stages = {
              "apt_update": os.environ.get("APT_UPDATE_OUTCOME", "unavailable"),
              "apt_install": os.environ.get("APT_INSTALL_OUTCOME", "unavailable"),
              "python_dependencies": os.environ.get("PYTHON_DEPS_OUTCOME", "unavailable"),
              "frozen_contract_tests": os.environ.get("FROZEN_CONTRACT_OUTCOME", "unavailable"),
              "desk_experiment": os.environ.get("DESK_EXPERIMENT_OUTCOME", "unavailable"),
          }
          order = list(stages.items())
          first_non_success = next(((key, value) for key, value in order if value != "success"), None)
          if first_non_success is None:
              status = "workflow_steps_succeeded"
          elif first_non_success[0] in ("apt_update", "apt_install", "python_dependencies"):
              status = "setup_failed_or_skipped"
          elif first_non_success[0] == "frozen_contract_tests":
              status = "preflight_contract_failed_or_skipped"
          else:
              status = "desk_experiment_failed_or_skipped"
          receipt = {
              "version": "echo-desk-workflow-phase-receipt-1",
              "status": status,
              "first_non_success_stage": first_non_success,
              "stage_outcomes": stages,
              "actual_checkout_sha": os.getenv("ECHO_TESTED_CHECKOUT_SHA"),
              "candidate_head_sha": os.getenv("ECHO_HEAD_SHA"),
              "github_sha": os.getenv("GITHUB_SHA"),
              "github_run_url": "https://github.com/" + os.getenv("GITHUB_REPOSITORY", "") +
                  "/actions/runs/" + os.getenv("GITHUB_RUN_ID", ""),
              "real_desk_report_present": (target / "report.json").exists(),
              "frozen_protocol_changed": False,
          }
          (target / "workflow-phase-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Preserve summary even on research-gate failure
        if: always()
        run: |
          if [ -f artifacts/tum-desk-full-mesh/SUMMARY.md ]; then
            cat artifacts/tum-desk-full-mesh/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No desk experiment summary; see workflow-phase-receipt.json and apt logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload original Mesh, per-view metrics and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tum-desk-full-mesh-${{ github.run_id }}
          path: artifacts/tum-desk-full-mesh/
          if-no-files-found: warn
          retention-days: 14

