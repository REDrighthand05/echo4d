name: TUM room real cross-frame foreground Mesh A/B

on:
  push:
    branches:
      - research/highres-rgbd-tsdf-quality-20261028
    paths:
      - 'tools/tum_room_sparse_quality.py'
      - 'tools/room_pose_icp.py'
      - 'tests/python/test_room_pose_icp.py'
      - 'tests/python/test_tum_room_sparse_quality.py'
      - '.github/workflows/tum-room-full-loop-sparse.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tum-room-crossframe-6cm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-room-crossframe-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked project and Open3D geometry engine
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install 'open3d==0.19.0'
      - name: Check frozen real-view selection and sparse geometry regression
        env:
          PYTHONPATH: tools
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m pytest -q tests/python/test_tum_room_sparse_quality.py tests/python/test_sparse_open3d.py tests/python/test_room_pose_icp.py
      - name: Reconstruct real fr1_room 25mm TSDF with and without 6cm cross-frame foreground guard
        env:
          PYTHONPATH: tools
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python tools/tum_room_sparse_quality.py \
            --cross-frame \
            --work "$RUNNER_TEMP/tum-room-crossframe-6cm" \
            --report-dir "$GITHUB_WORKSPACE/artifacts/tum-room-crossframe-6cm"
      - name: Show actual quality result or reproducible failure
        if: always()
        run: |
          if [ -f artifacts/tum-room-crossframe-6cm/SUMMARY.md ]; then
            cat artifacts/tum-room-crossframe-6cm/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain actual colored meshes, 3+2 images, metrics or failure receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tum-room-crossframe-6cm-${{ github.run_id }}
          path: artifacts/tum-room-crossframe-6cm/
          if-no-files-found: warn
          retention-days: 14
