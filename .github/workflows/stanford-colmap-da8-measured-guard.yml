name: Stanford Lounge 8 measured + 8 learned depth cross-view guard
on:
  push:
    branches: [research/stanford-da8-crossview-20261030]
    paths:
      - tools/stanford_colmap_da8_measured_guard.py
      - .github/workflows/stanford-colmap-da8-measured-guard.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stanford-colmap-da8-measured-guard
  cancel-in-progress: false
jobs:
  real-room-mesh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse identical 300 original RGB and 287 independent COLMAP poses
        uses: actions/download-artifact@v4
        with:
          name: stanford-300rgb-early-overlap-30depth-40970565394
          run-id: 40970565394
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: REDrighthand05/echo4d
          path: artifacts/early-colmap
      - name: Reuse eight real measured depths and four metric anchors
        uses: actions/download-artifact@v4
        with:
          name: stanford-eight-measured-control-41000309095
          run-id: 41000309095
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: REDrighthand05/echo4d
          path: artifacts/eight-measured-control
      - name: Reuse original 8 measured + 2 predicted comparison and configuration
        uses: actions/download-artifact@v4
        with:
          name: stanford-eight-da2-41011113006
          run-id: 41011113006
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: REDrighthand05/echo4d
          path: artifacts/eight-da2
      - name: Download frozen unfiltered 8+8 GLB for visual A/B only
        uses: actions/download-artifact@v4
        with:
          name: stanford-eight-da8-41023499444
          run-id: 41023499444
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: REDrighthand05/echo4d
          path: artifacts/eight-da8
      - name: Install pinned CPU geometry and execute real guard self-test
        run: |
          python -m pip install 'open3d==0.19.0' 'trimesh==4.11.1' 'pillow==11.3.0' 'scipy==1.16.2' 'scikit-image==0.25.2' 'opencv-python-headless==4.12.0.88'
          python -m pip install --no-deps -e .
          python -m py_compile tools/stanford_colmap_da8_measured_guard.py
          python tools/stanford_colmap_da8_measured_guard.py --self-test
      - name: Install pinned Apache-2.0 Depth Anything V2 Small CPU inference
        run: |
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.53.3' 'huggingface_hub==0.34.4'
      - name: Re-predict same eight RGB depths then guard before real TSDF fusion
        env:
          QT_QPA_PLATFORM: offscreen
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python tools/stanford_colmap_da8_measured_guard.py \
            --upstream artifacts/early-colmap \
            --control artifacts/eight-measured-control \
            --da2 artifacts/eight-da2 \
            --da8 artifacts/eight-da8 \
            --output artifacts/eight-da8-guarded
      - name: Verify real guarded Mesh and same three recorded plus two free views
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/eight-da8-guarded')
          r = json.loads((p/'receipt.json').read_text())
          assert r['status'] == 'REAL_MESH_GENERATED_VISUAL_REVIEW_REQUIRED', r
          assert r['measured_depth_maps'] == 8 and r['inferred_depth_maps'] == 8
          assert not r['prior_mesh'] and not r['ground_truth_poses'] and not r['gpu']
          assert r['sensor_target_holdouts_used_in_fusion'] is False
          assert len(r['cross_view_occlusion_guard']) == 8
          for name in ('measured8_da8_guarded.glb','source-da8-vs-guarded-3plus2.png'):
              assert (p/name).stat().st_size > 10000, name
          print(json.dumps({k:v['removed_pixels'] for k,v in
                            r['cross_view_occlusion_guard'].items()},indent=2))
          PY
      - name: Preserve actual GLB, guarded depths, five-view A/B and failure receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stanford-eight-da8-guarded-${{ github.run_id }}
          path: |
            artifacts/eight-da8-guarded/receipt.json
            artifacts/eight-da8-guarded/*.glb
            artifacts/eight-da8-guarded/*.png
          if-no-files-found: warn
          retention-days: 30
