name: frontend-shared-preview
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch canonical frontend from main
        run: git fetch origin main
      - name: Install shared frontend in ephemeral preview worktree
        shell: bash
        run: |
          source_ref=origin/main
          # Preview changes to the shared UI itself; research branches still consume main.
          merge_base=$(git merge-base HEAD origin/main)
          if ! git diff --quiet "$merge_base" HEAD -- dist/quality.html dist/quality.css dist/quality.mjs dist/quality-intake.mjs tools/install_frontend.py; then
            source_ref=HEAD
          fi
          git show "$source_ref:tools/install_frontend.py" > /tmp/echo-install-frontend.py
          python /tmp/echo-install-frontend.py --source "$source_ref" --force
          node --check dist/quality.mjs
          node --check dist/quality-intake.mjs
      - name: Check static assets
        shell: bash
        run: |
          test -s dist/quality.html
          test -s dist/quality.css
          test -s dist/quality.mjs
          test -s dist/quality-intake.mjs
          grep -q 'quality.mjs' dist/quality.html
          grep -q 'quality.css' dist/quality.html
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/quality.html
            dist/quality.css
            dist/quality.mjs
            dist/quality-intake.mjs
          retention-days: 14
