name: frontend-shared-preview
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch canonical frontend from main
        run: git fetch --depth=1 origin main
      - name: Install shared frontend in ephemeral preview worktree
        shell: bash
        run: |
          if git cat-file -e origin/main:tools/install_frontend.py 2>/dev/null; then
            git show origin/main:tools/install_frontend.py > /tmp/echo-install-frontend.py
          else
            cp tools/install_frontend.py /tmp/echo-install-frontend.py
          fi
          if git cat-file -e origin/main:dist/quality.html 2>/dev/null; then
            source_ref=origin/main
          else
            source_ref=HEAD
          fi
          python /tmp/echo-install-frontend.py --source "$source_ref" --force
          node --check dist/quality.mjs
      - name: Check static assets
        shell: bash
        run: |
          test -s dist/quality.html
          test -s dist/quality.css
          test -s dist/quality.mjs
          grep -q 'quality.mjs' dist/quality.html
          grep -q 'quality.css' dist/quality.html
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/quality.html
            dist/quality.css
            dist/quality.mjs
          retention-days: 14
