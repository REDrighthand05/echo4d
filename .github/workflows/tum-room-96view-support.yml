name: Real TUM room 96-view occlusion-aware predicted-depth support

on:
  push:
    branches:
      - research/room96-occlusion-support-20261029
    paths:
      - 'tools/tum_room_depth_support.py'
      - 'tools/tum_room_96view_support_run.py'
      - 'tests/python/test_tum_room_depth_support.py'
      - '.github/workflows/tum-room-96view-support.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: room96-support-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-room-support:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install same real Open3D CPU fusion dependencies, no model inference
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install 'open3d==0.19.0' 'opencv-python-headless==4.12.0.88' 'trimesh==4.11.1'
      - name: Test occlusion logic and source isolation
        env:
          PYTHONPATH: tools:src
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'
        run: |
          python -m py_compile tools/tum_room_depth_support.py tools/tum_room_96view_support_run.py
          python -m pytest -q tests/python/test_tum_room_depth_support.py tests/python/test_tum_room_96view_da2_complete.py tests/python/test_tum_room_pose_overlap_neighbors.py
      - name: Download verified original RGB/poses and 96 frozen RGB predictions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/room-source" "$RUNNER_TEMP/room-overlap"
          gh run download 40790769632 --repo "$GITHUB_REPOSITORY" --name tum-room-da2-consensus-40790769632 --dir "$RUNNER_TEMP/room-source"
          gh run download 40826766484 --repo "$GITHUB_REPOSITORY" --name tum-room-96-overlap-depth-40826766484 --dir "$RUNNER_TEMP/room-overlap"
          test -s "$RUNNER_TEMP/room-source/replay-inputs/source/recording.json"
          test -s "$RUNNER_TEMP/room-overlap/replay/predicted-96/recording.json"
          test -s "$RUNNER_TEMP/room-overlap/mesh-sensor-0/mesh.ply"
      - name: Real 96 RGB/pose filter, 0/32/64/96 sensor ladder and old/new 3+2
        env:
          PYTHONPATH: tools:src
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'
          ECHO_ROOM96_FROZEN_PREDICTIONS: ${{ runner.temp }}/room-overlap/replay/predicted-96
          ECHO_ROOM96_OLD_OVERLAP: ${{ runner.temp }}/room-overlap
        run: |
          python tools/tum_room_96view_support_run.py --source "$RUNNER_TEMP/room-source" --work "$RUNNER_TEMP/room96-support-work" --output "$GITHUB_WORKSPACE/artifacts/room96-support"
      - name: Preserve filtered predictions, four real GLB/PLY and old/new five-view board
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/room96-support-work/predicted-96" ]; then
            mkdir -p artifacts/room96-support/replay
            cp -a "$RUNNER_TEMP/room96-support-work/predicted-96" artifacts/room96-support/replay/
          fi
          if [ -f artifacts/room96-support/report.json ]; then
            python - <<'PY'
          import json
          r=json.load(open('artifacts/room96-support/report.json'))
          p=r.get('prediction',{}).get('cross_view_filter',{})
          print('REMOVED_PREDICTED_PIXELS',p.get('removed_pixels'))
          print('MESH_LEVELS',{k:(v.get('status'),v.get('faces')) for k,v in r.get('levels',{}).items()})
          print('DIRECT_OLD_NEW',r.get('direct_old_new',{}).get('visual_sha256'))
          print('ISSUE74',r.get('issue_74'))
          PY
          fi
      - name: Upload real model and failure evidence even if reconstruction fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tum-room-96-depth-support-${{ github.run_id }}
          path: artifacts/room96-support/
          if-no-files-found: warn
          retention-days: 14
