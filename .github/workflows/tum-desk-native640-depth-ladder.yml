name: TUM Desk native640 measured-depth 57 to 24 to 12 Mesh ladder
on:
  push:
    branches: [research/tum-desk-native640-depth-ladder-20261030]
    paths:
      - tools/tum_desk_native640_depth_ladder.py
      - tests/python/test_tum_desk_native640_depth_ladder.py
      - .github/workflows/tum-desk-native640-depth-ladder.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tum-desk-native640-depth-ladder
  cancel-in-progress: false

jobs:
  real-desk-depth-ladder:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install same Open3D stack as high-information baseline
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install 'open3d==0.19.0' 'trimesh>=4,<5' 'pytest==8.4.2'
      - name: Validate nested measured-depth selection
        env:
          PYTHONPATH: tools
        run: |
          python -m py_compile tools/tum_desk_native640_depth_ladder.py
          python -m pytest -q tests/python/test_tum_desk_native640_depth_ladder.py tests/python/test_tum_desk_native640_tsdf.py
      - name: Real TUM Freiburg1 Desk native 640 measured-depth Mesh 57 vs 24 vs 12
        env:
          PYTHONPATH: tools
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'
          QT_QPA_PLATFORM: offscreen
        run: |
          python tools/tum_desk_native640_depth_ladder.py \
            --work "$RUNNER_TEMP/tum-desk-native640-depth-ladder" \
            --output "$GITHUB_WORKSPACE/artifacts/tum-desk-native640-depth-ladder"
      - name: Reopen three colored GLBs and verify five-view outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import trimesh
          from PIL import Image
          root = Path("artifacts/tum-desk-native640-depth-ladder")
          receipt = json.loads((root / "result.json").read_text())
          assert receipt["status"] == "real_meshes_exported_visual_review_pending"
          assert len(receipt["views"]) == 5
          assert len(receipt["meshes"]) == 3
          for spec in receipt["meshes"].values():
              mesh = trimesh.load(root / spec["glb"], force="mesh")
              assert len(mesh.faces) > 100 and mesh.visual.kind == "vertex"
          for view in receipt["views"]:
              assert Image.open(root / view["file"]).size == (1280, 267)
          assert Image.open(root / "desk-native640-full-vs-24-vs-12-five-views.png").size == (1280, 1335)
          PY
      - name: Preserve real source photos, GLBs and same-view comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tum-desk-native640-depth-ladder-real
          path: artifacts/tum-desk-native640-depth-ladder/
          retention-days: 14
          if-no-files-found: warn
