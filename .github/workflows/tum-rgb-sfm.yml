name: public TUM RGB video to COLMAP SfM

on:
  pull_request:
    paths:
      - 'src/echo4d/video_sfm.py'
      - 'src/echo4d/sfm_eval.py'
      - 'tools/tum_rgb_sfm.py'
      - 'tests/python/test_video_sfm.py'
      - '.github/workflows/tum-rgb-sfm.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tum-rgb-sfm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  RGB-only-real-SfM:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install CPU COLMAP and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq colmap ffmpeg
          colmap --version
          ffmpeg -version | head -n 1
      - name: Install ECHO packages and test dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Validate camera, scale, path and failure contracts
        run: python -m pytest tests/python/test_video_sfm.py -q
      - name: Download pinned public RGB-D archive but feed RGB only to real COLMAP SfM
        env:
          ECHO_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/tum_rgb_sfm.py \
            --work "$RUNNER_TEMP/tum-rgb-sfm" \
            --report-dir "$GITHUB_WORKSPACE/artifacts/tum-rgb-sfm"
      - name: Append reproducible evidence to run summary
        if: always()
        run: |
          if [ -f artifacts/tum-rgb-sfm/SUMMARY.md ]; then
            cat artifacts/tum-rgb-sfm/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No report generated; consult errors and job log.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload actual trajectory, matched COLMAP model and failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tum-rgb-colmap-sfm-${{ github.run_id }}
          path: artifacts/tum-rgb-sfm/
          if-no-files-found: warn
          retention-days: 14