name: Mature official Open3D Redwood scene reconstruction
on:
  push:
    branches: [research/redwood-official-room-baseline-20261029]
    paths:
      - tools/open3d_official_room_baseline.py
      - tests/python/test_open3d_official_room_baseline.py
      - .github/workflows/redwood-official-room.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-sample-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
          pip install 'open3d==0.19.0' 'trimesh>=4,<5'
      - name: Test camera and data validation
        env:
          PYTHONPATH: tools
        run: python -m pytest -q tests/python/test_open3d_official_room_baseline.py
      - name: Real 5-frame Open3D smoke only (not whole room)
        env:
          PYTHONPATH: tools
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python tools/open3d_official_room_baseline.py --dataset sample \
            --frames 5 --cache "$RUNNER_TEMP/real-rgbd" \
            --output "$GITHUB_WORKSPACE/artifacts/redwood-sample"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open3d-redwood-sample-${{ github.run_id }}
          path: artifacts/redwood-sample/
          retention-days: 7
  complete-real-bedroom:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
          pip install 'open3d==0.19.0' 'trimesh>=4,<5'
      - name: Full Redwood Bedroom RGB-D using logged poses
        env:
          PYTHONPATH: tools
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python tools/open3d_official_room_baseline.py --dataset bedroom \
            --frames 360 --cache "$RUNNER_TEMP/real-rgbd" \
            --output "$GITHUB_WORKSPACE/artifacts/redwood-bedroom"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open3d-real-bedroom-${{ github.run_id }}
          path: artifacts/redwood-bedroom/
          retention-days: 14
