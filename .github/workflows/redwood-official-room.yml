name: Mature official Open3D Redwood scene reconstruction
on:
  push:
    branches: [research/redwood-official-room-baseline-20261029]
    paths:
      - tools/open3d_official_room_baseline.py
      - tests/python/test_open3d_official_room_baseline.py
      - .github/workflows/redwood-official-room.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-sample-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
          pip install 'open3d==0.19.0' 'trimesh>=4,<5'
      - name: Test camera and data validation
        env:
          PYTHONPATH: tools
        run: python -m pytest -q tests/python/test_open3d_official_room_baseline.py
      - name: Real 5-frame Open3D smoke only (not whole room)
        env:
          PYTHONPATH: tools
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python tools/open3d_official_room_baseline.py --dataset sample \
            --frames 5 --cache "$RUNNER_TEMP/real-rgbd" \
            --output "$GITHUB_WORKSPACE/artifacts/redwood-sample"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open3d-redwood-sample-${{ github.run_id }}
          path: artifacts/redwood-sample/
          retention-days: 7
  complete-real-bedroom:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
          pip install 'open3d==0.19.0' 'trimesh>=4,<5'
      - name: Full Redwood Bedroom RGB-D using logged poses
        env:
          PYTHONPATH: tools
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python tools/open3d_official_room_baseline.py --dataset bedroom \
            --frames 360 --cache "$RUNNER_TEMP/real-rgbd" \
            --output "$GITHUB_WORKSPACE/artifacts/redwood-bedroom"
      - name: Package real-room visual review, no supplied prior
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: real-bedroom-review-${{ github.run_id }}
          path: |
            artifacts/redwood-bedroom/visual/*.png
            artifacts/redwood-bedroom/recorded-rgbd-preview.glb
            artifacts/redwood-bedroom/results.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open3d-real-bedroom-${{ github.run_id }}
          path: artifacts/redwood-bedroom/
          retention-days: 14

  publish-room-review:
    needs: complete-real-bedroom
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: real-bedroom-review-${{ github.run_id }}
          path: review
      - name: Publish 5 images and colored Mesh for direct inspection
        run: |
          mkdir -p docs/real-room-review/redwood-bedroom/visual
          cp review/visual/*.png docs/real-room-review/redwood-bedroom/visual/
          cp review/recorded-rgbd-preview.glb docs/real-room-review/redwood-bedroom/
          cp review/results.json docs/real-room-review/redwood-bedroom/
          cat > docs/real-room-review/redwood-bedroom/README.md <<'EOF'
          # Redwood real bedroom: measured RGB-D reconstruction

          These five views and colored GLB are generated by stock Open3D
          ScalableTSDFVolume from 360 original-resolution RGB-D observations
          and the corresponding recorded camera poses.

          Photo-vs-mesh images: left = original photo, right = newly fused Mesh.
          Free-view images: Mesh only, novel camera viewpoints.

          No existing prior reconstruction was fused into this Mesh.
          The supplied prior is separate in the full run artifact.
          Human recognizability and accuracy are NOT yet accepted.

          Source: https://redwood-data.org/indoor_lidar_rgbd/
          Engine: https://github.com/isl-org/Open3D
          EOF
          git config user.name "echo4d-real-room-ci"
          git config user.email "echo4d-real-room-ci@users.noreply.github.com"
          git add docs/real-room-review/redwood-bedroom/
          git diff --cached --quiet && exit 0
          git commit -m "results(real-room): publish actual bedroom GLB and five views"
          git fetch origin research/redwood-official-room-baseline-20261029
          git rebase origin/research/redwood-official-room-baseline-20261029
          git push origin HEAD:refs/heads/research/redwood-official-room-baseline-20261029

  dense-real-bedroom:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
          pip install 'open3d==0.19.0' 'trimesh>=4,<5'
      - name: A/B 600 evenly spaced real RGB-D frames versus 360 baseline
        env:
          PYTHONPATH: tools
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python tools/open3d_official_room_baseline.py --dataset bedroom \
            --frames 600 --cache "$RUNNER_TEMP/real-rgbd" \
            --output "$GITHUB_WORKSPACE/artifacts/redwood-bedroom-dense"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-bedroom-dense-600-${{ github.run_id }}
          path: |
            artifacts/redwood-bedroom-dense/visual/*.png
            artifacts/redwood-bedroom-dense/recorded-rgbd-preview.glb
            artifacts/redwood-bedroom-dense/recorded-rgbd-full.ply
            artifacts/redwood-bedroom-dense/results.json
            artifacts/redwood-bedroom-dense/FAILURE.txt
          retention-days: 14

  publish-dense-review:
    needs: dense-real-bedroom
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: real-bedroom-dense-600-${{ github.run_id }}
          path: review
      - name: Publish A/B 600-frame actual geometry and fixed camera views
        run: |
          mkdir -p docs/real-room-review/redwood-bedroom-dense600/visual
          cp review/visual/*.png docs/real-room-review/redwood-bedroom-dense600/visual/
          cp review/recorded-rgbd-preview.glb docs/real-room-review/redwood-bedroom-dense600/
          cp review/results.json docs/real-room-review/redwood-bedroom-dense600/
          cat > docs/real-room-review/redwood-bedroom-dense600/README.md <<'EOF'
          # Redwood Bedroom: 600 real RGB-D frames, fixed review cameras

          Same 640x480 original RGB-D, logged poses, 0.025m voxel, stock
          Open3D TSDF as the 360-frame baseline. Only source frame count
          changes: 600 uniformly spread frames rather than 360.
          Three photo/mesh and two free-camera views use the SAME recorded
          comparison camera indices and free-camera definitions as the
          360-frame baseline. Do not mistake 5 review images for a full
          3D completeness test. No supplied prior used in fusion.

          Baseline: ../redwood-bedroom/
          Data: https://redwood-data.org/indoor_lidar_rgbd/
          EOF
          git config user.name "echo4d-real-room-ci"
          git config user.email "echo4d-real-room-ci@users.noreply.github.com"
          git add docs/real-room-review/redwood-bedroom-dense600/
          git diff --cached --quiet && exit 0
          git commit -m "results(real-room): 600-frame Bedroom geometry A/B with fixed cameras"
          git fetch origin research/redwood-official-room-baseline-20261029
          git rebase origin/research/redwood-official-room-baseline-20261029
          git push origin HEAD:refs/heads/research/redwood-official-room-baseline-20261029
