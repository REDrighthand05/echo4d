name: TUM posthoc MVS sensor-Z failure localization

on:
  push:
    branches:
      - research/mvs-sensor-posthoc-failure-localization-20261028
    paths:
      - 'tools/tum_plane_sweep_depth_diagnostic.py'
      - 'tests/python/test_tum_plane_sweep_depth_diagnostic.py'
      - '.github/workflows/tum-mvs-posthoc-depth-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  frozen-real-geometry-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install existing ECHO and diagnostic dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Synthetic true/false surface and coverage regression
        env:
          PYTHONPATH: tools
        run: python -m pytest -q tests/python/test_tum_plane_sweep_depth_diagnostic.py
      - name: Fetch frozen original old/new Mesh and RGB-inferred depth artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/previous
          gh run download 40692184301 --repo "$GITHUB_REPOSITORY" \
            --name tum-plane-sweep-crossview-ab-40692184301 \
            --dir artifacts/previous
          test -s artifacts/previous/old/reconstruction/mesh.ply
          test -s artifacts/previous/new/reconstruction/mesh.ply
          test -s artifacts/previous/old/inputs/recording.json
      - name: Download and verify pinned original TUM RGB-D for diagnosis only
        env:
          PYTHONPATH: tools
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os
          from tum_public_roundtrip import download, extract
          root = Path(os.environ['RUNNER_TEMP']) / 'tum-posthoc'
          root.mkdir()
          receipt = {}
          download(root / 'source.tgz', receipt)
          receipt['extraction'] = extract(root / 'source.tgz', root / 'dataset')
          (Path('artifacts') / 'posthoc-source-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Diagnose 48 training Z maps and 3 heldout old/new actual Mesh views
        env:
          PYTHONPATH: tools
        run: |
          python tools/tum_plane_sweep_depth_diagnostic.py \
            --old artifacts/previous/old --new artifacts/previous/new \
            --source-root "$RUNNER_TEMP/tum-posthoc/dataset" \
            --output artifacts/depth-diagnostic
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/depth-diagnostic/diagnostic.json').read_text())
          print('FROZEN TRAIN:', r['train_depth_diagnostic']['aggregate'])
          print('HELDOUT MESH:', r['heldout_mesh_diagnostic']['aggregate'])
          PY
      - name: Upload real failure-location images and numeric results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tum-mvs-posthoc-depth-diagnostic-${{ github.run_id }}
          path: |
            artifacts/depth-diagnostic/
            artifacts/posthoc-source-receipt.json
          if-no-files-found: warn
          retention-days: 14
