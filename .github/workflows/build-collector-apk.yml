name: build-collector-apk
on:
  push:
    paths:
      - 'collector/**'
      - '.github/workflows/build-collector-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK components
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          echo "SDK=$SDK"
          ls "$SDK" | head
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          ls "$SDK/platforms" "$SDK/build-tools"
      - name: Build debug APK
        working-directory: collector
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: echo-collector-apk
          path: collector/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
