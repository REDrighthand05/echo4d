name: TUM local-surface RGB fusion real Mesh A/B

on:
  push:
    branches:
      - research/mvs-sensor-posthoc-failure-localization-20261028
    paths:
      - 'src/echo4d/known_pose_depth_fusion.py'
      - 'tools/tum_plane_sweep_fusion_replay.py'
      - 'tests/python/test_known_pose_depth_fusion_local_surface.py'
      - '.github/workflows/tum-mvs-local-surface-real-ab.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  real-frozen-mesh-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked ECHO and real Mesh GLB export
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install --no-deps trimesh==4.11.1
      - name: Existing RGB fusion regressions and new local support
        env:
          PYTHONPATH: tools
        run: |
          python -m pytest -q tests/python/test_known_pose_depth_fusion.py \
            tests/python/test_known_pose_depth_fusion_local_surface.py \
            tests/python/test_tum_plane_sweep_depth_diagnostic.py
      - name: Reuse frozen prior MVS inference and original control Mesh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/old
          gh run download 40692184301 --repo "$GITHUB_REPOSITORY" \
            --name tum-plane-sweep-crossview-ab-40692184301 \
            --dir "$RUNNER_TEMP/prior"
          cp -r "$RUNNER_TEMP/prior/old/." artifacts/old/
          test -s artifacts/old/reconstruction/mesh.ply
      - name: Download pinned original RGB and measured Z only for posthoc diagnosis
        env:
          PYTHONPATH: tools
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          from tum_public_roundtrip import download, extract
          root=Path(os.environ['RUNNER_TEMP'])/'tum-fusion-replay'
          root.mkdir()
          receipt={}
          download(root/'source.tgz',receipt)
          extract(root/'source.tgz',root/'dataset')
          print('PINNED_ARCHIVE_SHA256',receipt['download']['sha256'])
          PY
      - name: Replay RGB-only inferred Z with local surface-supported crossview transfer into actual Mesh
        env:
          PYTHONPATH: tools
        run: |
          python tools/tum_plane_sweep_fusion_replay.py \
            --old artifacts/old \
            --source-root "$RUNNER_TEMP/tum-fusion-replay/dataset" \
            --target artifacts/new
      - name: Compare same three source photos and two frozen free cameras
        env:
          PYTHONPATH: tools
        run: |
          python tools/tum_plane_sweep_compare.py \
            --old artifacts/old --new artifacts/new \
            --source-root "$RUNNER_TEMP/tum-fusion-replay/dataset" \
            --output artifacts/frozen-five
      - name: Measure new-only real surface errors after both Mesh are frozen
        env:
          PYTHONPATH: tools
        run: |
          python tools/tum_plane_sweep_depth_diagnostic.py \
            --old artifacts/old --new artifacts/new \
            --source-root "$RUNNER_TEMP/tum-fusion-replay/dataset" \
            --output artifacts/depth-diagnostic
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/depth-diagnostic/diagnostic.json').read_text())
          print('TRAIN:',r['train_depth_diagnostic']['aggregate'])
          print('HELDOUT:',r['heldout_mesh_diagnostic']['aggregate'])
          c=json.loads(Path('artifacts/frozen-five/comparison.json').read_text())
          print('SAME-POSE COVERAGE:',[(v['view'],v['old_covered_pixels'],v['new_covered_pixels']) for v in c['views']])
          PY
      - name: Preserve actual Mesh, GLB, three source photos, five frozen views and posthoc FAIL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tum-mvs-local-surface-real-ab-${{ github.run_id }}
          path: |
            artifacts/new/
            artifacts/frozen-five/
            artifacts/depth-diagnostic/
          if-no-files-found: warn
          retention-days: 14
