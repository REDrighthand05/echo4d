name: Issue47 B decode-to-PNG identity review (FFmpeg required)

on:
  pull_request:
    paths:
      - 'tests/python/test_video_pts.py'
      - 'src/echo4d/video_pts.py'
      - '.github/workflows/issue47-pts-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-decoded-frame-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install actual FFmpeg and FFprobe
        timeout-minutes: 6
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y -qq ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Install locked Python environment
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Real CFR/VFR decoded pixels must match claimed frame indices
        run: |
          python -m pytest -q -rs --junitxml=pts-identity-junit.xml tests/python/test_video_pts.py
          python - <<'PY'
          from xml.etree import ElementTree as ET
          root = ET.parse('pts-identity-junit.xml').getroot()
          suites = [el for el in root.iter('testsuite')]
          assert suites, 'Missing pytest JUnit test suite'
          total = sum(int(el.attrib.get('tests', 0)) for el in suites)
          skipped = sum(int(el.attrib.get('skipped', 0)) for el in suites)
          failed = sum(int(el.attrib.get('failures', 0)) +
                       int(el.attrib.get('errors', 0)) for el in suites)
          print(f'actual tests: {total}; skipped: {skipped}; failed: {failed}')
          assert total >= 11 and skipped == 0 and failed == 0, 'FFmpeg identity checks not actually executed'
          PY
      - name: Archive real decode test report including failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue47-b-pts-identity-${{ github.run_id }}
          path: pts-identity-junit.xml
          if-no-files-found: warn
          retention-days: 14
