name: TUM desk 12cm TSDF bilateral measured-depth geometry

on:
  push:
    branches:
      - research/highres-rgbd-tsdf-quality-20261028
    paths:
      - 'tools/tum_desk_sparse_quality.py'
      - 'tools/sparse_open3d_fusion.py'
      - 'tests/python/test_sparse_open3d.py'
      - 'tests/python/test_tum_desk_sparse_quality.py'
      - '.github/workflows/tum-desk-wide-trajectory-sparse.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tum-desk-truncation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-desk-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked project and Open3D geometry engine
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install 'open3d==0.19.0'
      - name: Check frozen real-view selection and sparse geometry regression
        env:
          PYTHONPATH: tools
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m pytest -q tests/python/test_tum_desk_sparse_quality.py tests/python/test_sparse_open3d.py
      - name: Reconstruct 96-view desk 12cm TSDF baseline vs 3cm bilateral depth
        env:
          PYTHONPATH: tools
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python tools/tum_desk_sparse_quality.py \
            --work "$RUNNER_TEMP/tum-desk-wide" \
            --report-dir "$GITHUB_WORKSPACE/artifacts/tum-desk-wide"
      - name: Show actual quality result or reproducible failure
        if: always()
        run: |
          if [ -f artifacts/tum-desk-wide/SUMMARY.md ]; then
            cat artifacts/tum-desk-wide/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain actual colored meshes, 3+2 images, metrics or failure receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tum-desk-bilateral-${{ github.run_id }}
          path: artifacts/tum-desk-wide/
          if-no-files-found: warn
          retention-days: 14
