name: Hi3D object intake from actual ECHO scene (CPU only)

on:
  pull_request:
    paths:
      - 'tools/hi3d_candidate_intake.py'
      - 'tests/python/test_hi3d_candidate_intake.py'
      - '.github/workflows/hi3d-object-intake.yml'
      - 'docs/HI3D_OBJECT_CANDIDATE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-real-echo-static-mesh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install base requirements and isolated GLB IO helper
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install trimesh==4.11.1
      - name: Audit input rejection, reversible normalization and no false GPU success
        run: python -m pytest -q tests/python/test_hi3d_candidate_intake.py
      - name: Inspect the ACTUAL ECHO PR34 frozen real-data meshes (not furniture)
        run: |
          mkdir -p artifacts/hi3d-object-intake
          python tools/hi3d_candidate_intake.py inventory \
            --mesh docs/evidence/tum-static-ab-v2/a-known-pose-mesh.ply \
            --output artifacts/hi3d-object-intake/a-scene-inventory.json
          python tools/hi3d_candidate_intake.py inventory \
            --mesh docs/evidence/tum-static-ab-v2/b-estimated-pose-mesh.ply \
            --output artifacts/hi3d-object-intake/b-scene-inventory.json
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('artifacts/hi3d-object-intake')
          results=[json.loads((out/f'{a}-scene-inventory.json').read_text()) for a in 'ab']
          assert all(x['is_a_verified_standalone_furniture_object'] is False for x in results)
          assert all(x['decision']=='requires_furniture_mask_and_matching_real_image' for x in results)
          manifest={'status':'blocked_before_real_Hi3D_GPU_inference',
             'hi3d_inference_executed':False,
             'input':'actual ECHO #34 PR34 static room meshes, not isolated furniture',
             'objects_verified':0,'scene_inventories':results,
             'blockers':['No source-image/segmentation evidence proving any separate piece of furniture',
                         'No matched pre-registered heldout sensor-depth evidence of one specific isolated object',
                         'No NVIDIA GPU runtime or Hi3D weights in this workflow'],
             'meaning':'CPU inspection evidence only; no geometry refinement success claim'}
          (out/'report.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          summary=['# Hi3D on real ECHO meshes: intake result (not AI inference)', '',
            '**Decision: BLOCKED for single furniture Hi3D run.** Actual ECHO full-room meshes examined:', '']
          for i,a in enumerate('AB'):
              m=results[i]
              summary.append(f'- Mesh {a}: {m["vertices"]} vertices, {m["triangles"]} triangles, {m["face_connected_component_count"]} geometrically connected components, SHA256 `{m["source_mesh_sha256"]}`')
          summary+=['','A disconnected mesh component is not proven to be a chair/table. No source image or independent object-level measurement accompanies an isolated candidate.',
                    'No Hi3D GPU inference was run; see report.json for exact missing prerequisites.']
          (out/'SUMMARY.md').write_text('\n'.join(summary)+'\n')
          PY
      - name: Show evidence even when the inventory rejects input
        if: always()
        run: |
          if [ -f artifacts/hi3d-object-intake/SUMMARY.md ]; then
            cat artifacts/hi3d-object-intake/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Input or tests failed before inventory; see job logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve inventory and truthful blocked report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hi3d-echo-mesh-inventory-${{ github.run_id }}
          path: artifacts/hi3d-object-intake/
          retention-days: 21
          if-no-files-found: warn
