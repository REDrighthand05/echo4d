name: TUM desk 25mm vs 18mm voxel real Mesh A/B

on:
  push:
    branches:
      - research/highres-rgbd-tsdf-quality-20261028
    paths:
      - 'tools/tum_desk_sparse_quality.py'
      - 'tools/sparse_open3d_fusion.py'
      - 'tests/python/test_tum_desk_sparse_quality.py'
      - '.github/workflows/tum-desk-single-truncation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tum-desk-fine-voxel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-fine-voxel-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install project and Open3D
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install 'open3d==0.19.0'
      - name: Run geometry regressions
        env:
          PYTHONPATH: tools
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m pytest -q tests/python/test_tum_desk_sparse_quality.py tests/python/test_sparse_open3d.py
      - name: Real 640x480 TUM desk 96-frame 25mm vs 18mm TSDF
        env:
          PYTHONPATH: tools
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python tools/tum_desk_sparse_quality.py \
            --fine-voxel \
            --work "$RUNNER_TEMP/tum-desk-fine-voxel" \
            --report-dir "$GITHUB_WORKSPACE/artifacts/tum-desk-fine-voxel"
      - name: Surface Mesh result or failure
        if: always()
        run: |
          if [ -f artifacts/tum-desk-fine-voxel/SUMMARY.md ]; then
            cat artifacts/tum-desk-fine-voxel/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain both real colored Meshes and 3+2 views (18mm vs 25mm)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tum-desk-fine-voxel-${{ github.run_id }}
          path: artifacts/tum-desk-fine-voxel/
          if-no-files-found: warn
          retention-days: 14
