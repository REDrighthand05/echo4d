name: TUM Desk native640 isolated-island geometry A/B
on:
  push:
    branches: [research/tum-desk-native640-island-prune-20261030]
    paths:
      - tools/tum_desk_component_prune.py
      - tests/python/test_tum_desk_component_prune.py
      - .github/workflows/tum-desk-component-prune.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  measured-mesh-component-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mesh tooling
        run: python -m pip install 'numpy>=2,<3' 'trimesh>=4,<5' 'scipy>=1.13,<2' 'vtk>=9.4,<10' 'Pillow>=10,<13' 'pytest>=8,<10'
      - name: Check component removal and RGB preservation
        env:
          PYTHONPATH: tools
        run: python -m pytest -q tests/python/test_tum_desk_component_prune.py
      - name: Download previously reconstructed real Desk native640 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/desk-source"
          gh run download 41068611251 --repo "$GITHUB_REPOSITORY" \
            --name tum-desk-native640-real --dir "$RUNNER_TEMP/desk-source"
          test -s "$RUNNER_TEMP/desk-source/desk-native-640-12mm.glb"
      - name: Prune isolated measured triangles and render five fixed virtual A/B views
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'
        run: |
          python tools/tum_desk_component_prune.py \
            --input "$RUNNER_TEMP/desk-source/desk-native-640-12mm.glb" \
            --photos "$RUNNER_TEMP/desk-source" \
            --output "$GITHUB_WORKSPACE/artifacts/tum-desk-island-prune"
      - name: Preserve real GLB, source photos, five-view comparison and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tum-desk-native640-island-prune-real
          path: artifacts/tum-desk-island-prune/
          retention-days: 14
          if-no-files-found: warn
