name: TUM second office scene real RGB SfM

on:
  pull_request:
    paths:
      - 'tools/tum_desk_sfm.py'
      - 'tests/python/test_tum_desk_sfm.py'
      - '.github/workflows/tum-cross-scene-desk.yml'
      - 'docs/evidence/tum-cross-scene-desk/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tum-desk-scene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-scene-RGB-only-SfM:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install real CPU COLMAP and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq colmap ffmpeg
          colmap help
      - name: Install pinned ECHO dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Check failure contracts and unsafe archives
        run: |
          PYTHONPATH="${PYTHONPATH:+$PYTHONPATH:}$GITHUB_WORKSPACE/tools" python -m pytest tests/python/test_tum_desk_sfm.py -q
      - name: Download real second scene and execute COLMAP from RGB only
        env:
          ECHO_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/tum_desk_sfm.py \
            --work "$RUNNER_TEMP/tum-desk-sfm" \
            --report-dir "$GITHUB_WORKSPACE/artifacts/tum-desk-sfm"
      - name: Publish experiment summary even on errors
        if: always()
        run: |
          if [ -f artifacts/tum-desk-sfm/SUMMARY.md ]; then
            cat artifacts/tum-desk-sfm/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No report written; see failed setup/tests and job logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep machine report, raw pose track and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tum-desk-cross-scene-${{ github.run_id }}
          path: artifacts/tum-desk-sfm/
          if-no-files-found: warn
          retention-days: 14
