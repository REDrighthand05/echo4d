name: Stanford native room-scale view review
on:
  push:
    branches: [research/stanford-lounge-planar-support-20261029]
    paths: [.github/workflows/stanford-native-wide-views.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
          pip install 'open3d==0.19.0' 'trimesh>=4,<5'
      - name: Use full native observed scene
        run: |
          mkdir -p artifacts/native-wide
          cp docs/real-room-review/stanford-lounge-native-planar/*.glb artifacts/native-wide/
          cp docs/real-room-review/stanford-lounge-native-planar/result.json artifacts/native-wide/
      - name: Three recorded and two room-scale free views
        env:
          PYTHONPATH: tools
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python tools/stanford_planar_real_views.py \
            --output artifacts/native-wide \
            --cache "$RUNNER_TEMP/lounge-rgbd"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stanford-native-wide-${{ github.run_id }}
          path: artifacts/native-wide/
          retention-days: 14
