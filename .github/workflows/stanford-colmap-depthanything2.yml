name: Stanford Lounge eight measured versus two Depth Anything V2 CPU depth maps
on:
  push:
    branches: [research/stanford-colmap300-depthanything2-20261030]
    paths:
      - tools/stanford_colmap_depthanything2.py
      - .github/workflows/stanford-colmap-depthanything2.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stanford-colmap-depthanything2
  cancel-in-progress: false
jobs:
  real-rgb-mvs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download frozen original RGB and independently estimated COLMAP poses
        uses: actions/download-artifact@v4
        with:
          name: stanford-300rgb-early-overlap-30depth-40970565394
          run-id: 40970565394
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: REDrighthand05/echo4d
          path: artifacts/early-colmap
      - name: Download eight measured depth comparison as visual baseline only
        uses: actions/download-artifact@v4
        with:
          name: stanford-eight-measured-control-41000309095
          run-id: 41000309095
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: REDrighthand05/echo4d
          path: artifacts/eight-measured-control
      - name: Install pinned CPU geometry dependencies and run synthetic plane-depth test
        run: |
          python -m pip install 'open3d==0.19.0' 'trimesh==4.11.1' 'pillow==11.3.0' 'scipy==1.16.2' 'scikit-image==0.25.2' 'opencv-python-headless==4.12.0.88'
          python -m pip install --no-deps -e .
          python -m py_compile tools/stanford_colmap_depthanything2.py
          python tools/stanford_colmap_depthanything2.py --self-test
      - name: Install CPU PyTorch and pinned Apache-2.0 Depth Anything V2 Small runtime
        run: |
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.53.3' 'huggingface_hub==0.34.4'
      - name: Infer two depth maps from pretrained CPU model and build a fresh colored Mesh
        env:
          QT_QPA_PLATFORM: offscreen
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python tools/stanford_colmap_depthanything2.py \
            --upstream artifacts/early-colmap \
            --control artifacts/eight-measured-control \
            --output artifacts/eight-da2
      - name: Confirm real RGB predicted maps, colored GLB and five-view comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/eight-da2')
          r=json.loads((p/'receipt.json').read_text())
          assert r['status']=='REAL_MESH_GENERATED_VISUAL_REVIEW_REQUIRED',r
          assert r['input_rgb']==300 and r['registered_rgb']==287
          assert r['measured_depth_maps']==8 and r['inferred_depth_maps']==2
          assert len(r['inferred'])==2
          assert all(x['valid_fraction']>.002 for x in r['inferred'])
          assert not r['prior_mesh'] and not r['ground_truth_poses'] and not r['gpu']
          for name in ('measured8_da2.glb','source-eight-only-vs-eight-da2-3plus2.png'):
              assert (p/name).stat().st_size>10000,name
          print(json.dumps(r,indent=2))
          PY
      - name: Preserve actual Mesh, five-view image, predicted depth maps and failure receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stanford-eight-da2-${{ github.run_id }}
          path: |
            artifacts/eight-da2/receipt.json
            artifacts/eight-da2/*.glb
            artifacts/eight-da2/*.png
          if-no-files-found: warn
          retention-days: 30
