name: TUM real room known-pose RGB multi-view plane sweep

on:
  push:
    branches:
      - research/room-knownpose-multiview-sweep-20261029
    paths:
      - 'tools/tum_room_knownpose_multiview.py'
      - 'tests/python/test_tum_room_knownpose_multiview.py'
      - '.github/workflows/tum-room-knownpose-multiview.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: room-multiview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-room-multiview:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned CPU geometry dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install 'open3d==0.19.0' 'opencv-python-headless==4.12.0.88' 'trimesh==4.11.1'
      - name: Test CPU multi-view homography and negative controls
        env:
          PYTHONPATH: tools
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -m py_compile tools/tum_room_knownpose_multiview.py
          python -m pytest -q tests/python/test_tum_room_knownpose_multiview.py tests/python/test_tum_room_rgb_stereo_ablation.py
      - name: Recover frozen same-room measured-depth and previous RGB stereo Mesh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/room-highinfo" "$RUNNER_TEMP/room-stereo"
          gh run download 40750777392 --repo "$GITHUB_REPOSITORY" --name tum-room-dense-120-40750777392 --dir "$RUNNER_TEMP/room-highinfo"
          gh run download 40759191600 --repo "$GITHUB_REPOSITORY" --name tum-room-rgb-stereo-ablation-40759191600 --dir "$RUNNER_TEMP/room-stereo"
          test -s "$RUNNER_TEMP/room-highinfo/room-96-fine-wide/mesh.ply"
          test -s "$RUNNER_TEMP/room-highinfo/room-sparse-quality-report.json"
          test -s "$RUNNER_TEMP/room-stereo/rgb-stereo-mesh/mesh.ply"
      - name: Real 96-pose TUM room multi-view RGB depth and actual Mesh
        env:
          PYTHONPATH: tools
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python tools/tum_room_knownpose_multiview.py \
            --work "$RUNNER_TEMP/tum-room-multiview" \
            --baseline "$RUNNER_TEMP/room-highinfo" \
            --stereo "$RUNNER_TEMP/room-stereo" \
            --report-dir "$GITHUB_WORKSPACE/artifacts/room-multiview"
      - name: Print actual result, never imply visual PASS
        if: always()
        run: |
          if [ -f artifacts/room-multiview/report.json ]; then
            python - <<'PY'
          import json
          r=json.load(open('artifacts/room-multiview/report.json'))
          print('STATUS',r['status'],'ERROR',r.get('error'),'NEW_MESH',r.get('new_mesh'))
          print('DEPTH_FRAMES',r.get('inferred_depth_frames'),'ISSUE_74',r['issue_74'])
          PY
          fi
      - name: Retain real Mesh, GLB, three heldout and two free views, failure or success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tum-room-knownpose-multiview-${{ github.run_id }}
          path: artifacts/room-multiview/
          if-no-files-found: warn
          retention-days: 14
