name: Real Lounge independent RGB two-view Mesh vs gap hallucination
on:
  push:
    branches: [research/lounge-rgb-crossview24-20261031]
    paths:
      - tools/lounge_rgb_crossview_support.py
      - tools/lounge_sparse_rgb_real.py
      - tests/python/test_lounge_rgb_crossview_support.py
      - .github/workflows/lounge-rgb-crossview24.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lounge-rgb-crossview24
  cancel-in-progress: true

jobs:
  real-lounge-rgb-crossview:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing reconstruction runtime
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install 'open3d==0.19.0' 'trimesh==4.11.1' 'pytest==8.4.2'
      - name: Execute RGB agreement geometry regressions
        env:
          PYTHONPATH: tools
        run: |
          python -m py_compile tools/lounge_rgb_crossview_support.py tools/lounge_sparse_rgb_real.py
          python -m pytest -q tests/python/test_lounge_rgb_crossview_support.py tests/python/test_lounge_rgb_gap_select.py tests/python/test_lounge_sparse_rgb_real.py
      - name: Install pinned Apache-2.0 CPU Depth Anything V2
        run: |
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.53.3' 'huggingface_hub==0.34.4'
      - name: Run original Stanford Lounge RGB and measured-depth reconstruction
        env:
          PYTHONPATH: tools
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'
          QT_QPA_PLATFORM: offscreen
          HF_HUB_DISABLE_XET: '1'
        run: |
          python tools/lounge_sparse_rgb_real.py \
            --work "$RUNNER_TEMP/lounge-rgb-crossview" \
            --output "$GITHUB_WORKSPACE/artifacts/lounge-rgb-crossview" \
            --gap-selection --crossview
      - name: Upload actual colored GLBs, 3 native RGB, 3+2 views and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lounge-real-independent-rgb-crossview24
          path: artifacts/lounge-rgb-crossview/
          retention-days: 14
          if-no-files-found: warn
