name: Redwood second-scene real 3m vs 4.5m measured Mesh A/B
on:
  push:
    branches: [research/redwood-bedroom-depth-cutoff-ab-20261030]
    paths:
      - tools/redwood_bedroom_depth_cutoff_ab.py
      - tests/python/test_redwood_bedroom_depth_cutoff_ab.py
      - .github/workflows/redwood-bedroom-depth-cutoff-ab.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  second-real-room-mesh:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mature CPU RGB-D fusion and export
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install 'open3d==0.19.0' 'trimesh>=4,<5'
      - name: Check depth truncation and visual panel guards
        env:
          PYTHONPATH: tools
        run: python -m pytest -q tests/python/test_redwood_bedroom_depth_cutoff_ab.py
      - name: Fetch observed-only 600-frame 4.5m frozen comparison Mesh
        uses: actions/download-artifact@v4
        with:
          repository: REDrighthand05/echo4d
          run-id: 40778686280
          name: real-bedroom-dense-600-40778686280
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source
      - name: Independently re-fuse 600 real native RGB-D frames at 3m and render 3+2
        env:
          PYTHONPATH: tools
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python tools/redwood_bedroom_depth_cutoff_ab.py \
            --source-ply source/recorded-rgbd-full.ply \
            --cache "$RUNNER_TEMP/redwood-bedroom-real" \
            --output "$GITHUB_WORKSPACE/artifacts/redwood-depth-ab"
      - name: Upload actual color Mesh and five original/free camera comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redwood-bedroom-depth-ab-${{ github.run_id }}
          path: artifacts/redwood-depth-ab/
          retention-days: 14
          if-no-files-found: warn
