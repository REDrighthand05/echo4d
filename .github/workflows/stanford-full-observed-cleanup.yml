name: Stanford full observed Mesh geometry cleanup A/B
on:
  push:
    branches: [research/stanford-3000-observed-component-cleanup-20261029]
    paths:
      - tools/stanford_full_observed_speck_cleanup.py
      - .github/workflows/stanford-full-observed-cleanup.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  full-observed-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned observed Mesh processing dependencies
        run: |
          python -m pip install 'open3d==0.19.0' 'trimesh==4.11.1' 'numpy<3' pillow
          python -m py_compile tools/stanford_full_observed_speck_cleanup.py
      - name: Fetch actual 3000-frame estimated-pose room (no prior Mesh)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40877823227 --repo "$GITHUB_REPOSITORY" --name official-room-recovered-40877823227 --dir "$RUNNER_TEMP/full-room"
          test -s "$RUNNER_TEMP/full-room/scene/integrated.ply"
          test -s "$RUNNER_TEMP/full-room/scene/trajectory.log"
          test -s "$RUNNER_TEMP/full-room/views/recorded-00000.png"
      - name: Remove tiny disconnected observed components and render exact five-view A/B
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python tools/stanford_full_observed_speck_cleanup.py --source "$RUNNER_TEMP/full-room" --output artifacts/full-observed-cleanup
      - name: Preserve colored observed GLB and same-camera five-view visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stanford-full-observed-cleanup-${{ github.run_id }}
          path: |
            artifacts/full-observed-cleanup/receipt.json
            artifacts/full-observed-cleanup/five-view-observed-ab.png
            artifacts/full-observed-cleanup/observed-3000-speck-filtered.glb
            artifacts/full-observed-cleanup/observed-3000-speck-filtered-preview.glb
          retention-days: 30
          if-no-files-found: warn
