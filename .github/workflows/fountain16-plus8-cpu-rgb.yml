name: Real Fountain 16 measured + 8 RGB-only CPU depths, 3+2 Mesh A/B
on:
  push:
    branches: [research/fountain16-plus8-rgb-cpu-20261031]
    paths:
      - tools/fountain_cpu_rgb_depth8.py
      - tests/python/test_fountain_cpu_rgb_depth8.py
      - .github/workflows/fountain16-plus8-cpu-rgb.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fountain16-plus8-cpu-rgb
  cancel-in-progress: false

jobs:
  fountain-real-16-sensor-8-rgb:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing reconstruction and test dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install 'open3d==0.19.0' 'trimesh==4.11.1' 'pytest==8.4.2'
      - name: Test disjoint RGB target cohort and sensor-only scale fit
        env:
          PYTHONPATH: tools
        run: |
          python -m py_compile tools/fountain_cpu_rgb_depth8.py
          python -m pytest -q tests/python/test_fountain_cpu_rgb_depth8.py tests/python/test_fountain_depth_ladder.py
      - name: Install CPU Depth Anything V2 Small (pinned model hash checked at runtime)
        run: |
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.53.3' 'huggingface_hub==0.34.4'
      - name: Produce actual real 16 sensor vs 16 sensor plus 8 CPU RGB Meshes
        env:
          PYTHONPATH: tools
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'
          QT_QPA_PLATFORM: offscreen
          HF_HUB_DISABLE_XET: '1'
        run: |
          python tools/fountain_cpu_rgb_depth8.py \
            --work "$RUNNER_TEMP/fountain16-plus8-rgb" \
            --output "$GITHUB_WORKSPACE/artifacts/fountain16-plus8-rgb"
      - name: Reopen three colored GLBs and inspect original RGB and five fixed views
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          import trimesh
          p = Path("artifacts/fountain16-plus8-rgb")
          r = json.loads((p/"result.json").read_text())
          assert r["status"] == "real_three_glbs_exported_visual_review_pending", r
          assert len(r["retained_sensor_indices"]) == 16
          assert len(r["rgb_only_target_indices"]) == 8
          assert len(r["independent_holdout_indices"]) == 9
          assert not set(r["retained_sensor_indices"]) & set(r["rgb_only_target_indices"])
          assert r["target_sensor_depth_used_in_reconstruction"] is False
          assert r["supplied_scan_prior_used"] is False
          assert len([x for x in r["predictions"] if x["used"]]) >= 3
          assert len(r["views"]) == 5 and len(r["meshes"]) == 3
          for m in r["meshes"].values():
              mesh = trimesh.load(str(p/m["glb"]), force="mesh", process=False)
              assert len(mesh.faces) > 1000 and mesh.visual.kind == "vertex"
          assert len(list(p.glob("source-*-native.png"))) == 3
          assert Image.open(p/"fountain-33-vs-16-vs-16plus8rgb-five-views.png").size == (1280, 1335)
          PY
      - name: Preserve real source RGB, predicted depths, colored GLBs, visual A/B and FAIL receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fountain-real-16sensor-plus8-cpu-rgb
          path: artifacts/fountain16-plus8-rgb/
          if-no-files-found: warn
          retention-days: 30
