name: Resume frozen RGB video scene export
on:
  push:
    paths: ['.github/workflows/video-scene-resume.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: video-scene-resume-${{ github.ref }}
  cancel-in-progress: true
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y blender python3-numpy
      - run: python -m pip install -e . trimesh==4.11.1
      - uses: actions/download-artifact@v4
        with:
          name: recovered-rgb-video-scene-aa30a1e8bc5d614cefc0b0405a40205c12641015
          run-id: 40968846555
          github-token: ${{ github.token }}
      - name: Pack existing textures, export Blender and five views; no geometry rerun
        env:
          ECHO_SOURCE_RUN: '40968846555'
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: python tools/resume_video_scene.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exported-rgb-video-scene-${{ github.sha }}
          path: |
            video-result/scene-delivery.zip
            video-result/scene.blend
            video-result/scene.json
            video-result/scene_textured*.glb
            video-result/scene-report*.json
            video-result/camera-timeline.json
            video-result/views
            video-result/review
            video-result/*.log
            trial-source/input.json
            trial-source/input.mp4
            backend-patch.json
