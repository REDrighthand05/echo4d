name: TUM room 96-view measured Z to frozen DA2 depth ablation

on:
  push:
    branches:
      - research/room-96view-da2-depth-ablation-20261029
    paths:
      - 'tools/tum_room_96view_da2_ablation.py'
      - 'tests/python/test_tum_room_96view_da2_ablation.py'
      - '.github/workflows/tum-room-96view-da2-ablation.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: room-96view-da2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-room-96view-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install existing CPU Open3D fusion and RGB-depth adapter
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install 'open3d==0.19.0' 'opencv-python-headless==4.12.0.88' 'trimesh==4.11.1'
      - name: Compile and run depth-source isolation tests
        env:
          PYTHONPATH: tools:src
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m py_compile tools/tum_room_96view_da2_ablation.py
          python -m pytest -q tests/python/test_tum_room_96view_da2_ablation.py tests/python/test_tum_room_sensor_anchor_ladder.py
      - name: Recover SHA-verified real TUM RGB and DA2 depth from #99
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/room-source"
          gh run download 40790769632 --repo "$GITHUB_REPOSITORY" \
            --name tum-room-da2-consensus-40790769632 --dir "$RUNNER_TEMP/room-source"
          test -s "$RUNNER_TEMP/room-source/replay-inputs/ledger.json"
          test -s "$RUNNER_TEMP/room-source/replay-inputs/source/recording.json"
          test -s "$RUNNER_TEMP/room-source/replay-inputs/inferred/recording.json"
      - name: Real 96-frame sensor->DA2 ablation on fixed RGB and poses
        env:
          PYTHONPATH: tools:src
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'
        run: |
          python tools/tum_room_96view_da2_ablation.py \
            --source "$RUNNER_TEMP/room-source" \
            --work "$RUNNER_TEMP/room-96-work" \
            --output "$GITHUB_WORKSPACE/artifacts/room-96-da2"
      - name: Report actual meshes, do not auto-accept geometry
        if: always()
        run: |
          if [ -f artifacts/room-96-da2/report.json ]; then
            python - <<'PY'
          import json
          r=json.load(open('artifacts/room-96-da2/report.json'))
          print('96-VIEW INPUT LEVELS',list(r['levels']))
          for key,value in r['levels'].items():
              print(key,'predicted',value['predicted_frames'],'faces',value['faces'],
                    'views',value.get('five_views'))
          print('ISSUE74',r['issue_74'])
          PY
          fi
      - name: Preserve four real GLBs, 3+2 original RGB comparisons and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tum-room-96view-da2-${{ github.run_id }}
          path: artifacts/room-96-da2/
          if-no-files-found: warn
          retention-days: 14
