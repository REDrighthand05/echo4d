name: TUM RGB-MVS observed-edge TSDF Mesh A/B

on:
  push:
    branches:
      - research/mvs-observed-edge-extraction-20261028
    paths:
      - 'src/echo4d/known_pose_edge_extraction.py'
      - 'tools/tum_mvs_observed_edges.py'
      - 'tests/python/test_known_pose_edge_extraction.py'
      - '.github/workflows/tum-mvs-observed-edges-real-ab.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  real-mesh-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked Echo4D and GLB exporter
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install --no-deps trimesh==4.11.1
      - name: Test observed-edge and unknown-support boundaries
        run: |
          python -m py_compile tools/tum_mvs_observed_edges.py
          python -m pytest -q tests/python/test_known_pose_edge_extraction.py
      - name: Recover exact original frozen RGB-inferred Z and control Mesh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/old
          gh run download 40692184301 --repo "$GITHUB_REPOSITORY" \
            --name tum-plane-sweep-crossview-ab-40692184301 \
            --dir "$RUNNER_TEMP/prior"
          cp -r "$RUNNER_TEMP/prior/old/." artifacts/old/
          test -s artifacts/old/inputs/recording.json
          test -s artifacts/old/reconstruction/mesh.ply
      - name: Download pinned original TUM RGB and metric poses
        env:
          PYTHONPATH: tools
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          from tum_public_roundtrip import download, extract
          root = Path(os.environ['RUNNER_TEMP']) / 'tum-observed-edge'
          root.mkdir()
          receipt = {}
          download(root / 'source.tgz', receipt)
          extract(root / 'source.tgz', root / 'dataset')
          print('SOURCE_SHA256', receipt['download']['sha256'])
          PY
      - name: Reintegrate same 48 inferred Z maps; extract observed-edge Mesh
        env:
          PYTHONPATH: tools
        run: |
          python tools/tum_mvs_observed_edges.py \
            --old artifacts/old \
            --source-root "$RUNNER_TEMP/tum-observed-edge/dataset" \
            --target artifacts/new
      - name: Render original RGB + 3 frozen camera poses + 2 free camera poses
        env:
          PYTHONPATH: tools
        run: |
          python tools/tum_plane_sweep_compare.py \
            --old artifacts/old --new artifacts/new \
            --source-root "$RUNNER_TEMP/tum-observed-edge/dataset" \
            --output artifacts/frozen-five
          python - <<'PY'
          import json
          from pathlib import Path
          new = json.loads(Path('artifacts/new/report.json').read_text())
          ab = json.loads(Path('artifacts/frozen-five/comparison.json').read_text())
          print('CONTROL_FACES',new['control_faces_replayed'])
          print('NEW_FACES',new['new_mesh_summary']['triangles'])
          print('EDGE_SUPPORT',new['edge_extraction'])
          print('FROZEN_COVERAGE',[(v['view'],v['old_covered_pixels'],v['new_covered_pixels']) for v in ab['views']])
          print('VISUAL_ACCEPTANCE',new['visual_acceptance'])
          PY
      - name: Preserve original photos, real PLY/GLB and five-view negative or positive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tum-mvs-observed-edge-ab-${{ github.run_id }}
          path: |
            artifacts/old/inputs/
            artifacts/old/report.json
            artifacts/old/reconstruction/mesh.ply
            artifacts/new/control-replayed.ply
            artifacts/new/report.json
            artifacts/new/reconstruction/mesh.ply
            artifacts/frozen-five/
          if-no-files-found: warn
          retention-days: 14
