name: RGB video dense scene real trial
on:
  push:
    paths: ['.github/workflows/video-scene-real.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rgb-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y colmap ffmpeg blender python3-numpy cmake ninja-build libboost-iostreams-dev libboost-program-options-dev libboost-system-dev libboost-serialization-dev libeigen3-dev libopencv-dev libcgal-dev
      - run: python -m pip install -e . open3d==0.19.0 trimesh==4.11.1
      - name: Build pinned CPU OpenMVS, no GPU claim
        run: |
          git clone https://github.com/cdcseacave/openMVS.git /tmp/openmvs
          git -C /tmp/openmvs checkout 58117204c86bbb11a0b25b26a8987676cf11274d
          git clone https://github.com/cnr-isti-vclab/vcglib.git /tmp/vcglib
          git -C /tmp/vcglib checkout 5cae2abc2f9056785b0537dcbe156c40da2aea20
          env -u VCPKG_ROOT cmake -S /tmp/openmvs -B /tmp/openmvs-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVCG_ROOT=/tmp/vcglib -DOpenMVS_USE_CUDA=OFF -DOpenMVS_BUILD_VIEWER=OFF -DOpenMVS_USE_PYTHON=OFF -DOpenMVS_ENABLE_IPO=OFF -DOpenMVS_ENABLE_TESTS=OFF -DOpenMVS_USE_BREAKPAD=OFF
          cmake --build /tmp/openmvs-build --parallel 2 --target InterfaceCOLMAP DensifyPointCloud ReconstructMesh RefineMesh TextureMesh
          mkdir -p /tmp/mvs-bin
          find /tmp/openmvs-build -type f -executable -name InterfaceCOLMAP -exec cp '{}' /tmp/mvs-bin/ \;
          find /tmp/openmvs-build -type f -executable -name DensifyPointCloud -exec cp '{}' /tmp/mvs-bin/ \;
          find /tmp/openmvs-build -type f -executable -name ReconstructMesh -exec cp '{}' /tmp/mvs-bin/ \;
          find /tmp/openmvs-build -type f -executable -name RefineMesh -exec cp '{}' /tmp/mvs-bin/ \;
          find /tmp/openmvs-build -type f -executable -name TextureMesh -exec cp '{}' /tmp/mvs-bin/ \;
      - name: Package actual public RGB pixels as an MP4 input, no depth or GT pose consumed
        run: |
          mkdir -p trial-source/frames
          python - <<'PY'
          import open3d as o3d
          import hashlib,json,shutil
          from pathlib import Path
          source=o3d.data.LoungeRGBDImages()
          colors=source.color_paths[:540:3]
          manifest=[]
          for i,p in enumerate(colors):
              target=Path('trial-source/frames')/f'{i:05d}.jpg'
              shutil.copyfile(p,target)
              manifest.append({'input':Path(p).name,'output':target.name,'sha256':hashlib.sha256(target.read_bytes()).hexdigest()})
          Path('trial-source/input.json').write_text(json.dumps({'source':'Open3D public Stanford Lounge RGB', 'kind':'real RGB image sequence repackaged as MP4, not original camera video', 'time':'authored 10fps clip; source acquisition times unavailable', 'depth_or_gt_pose_read':False,'frames':manifest},indent=2))
          PY
          ffmpeg -hide_banner -loglevel error -framerate 10 -i trial-source/frames/%05d.jpg -c:v libx264 -crf 15 -pix_fmt yuv420p trial-source/input.mp4
      - name: Execute the real video CLI end to end
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: echo4d video-scene --video trial-source/input.mp4 --output video-result --max-frames 120 --camera-model PINHOLE --camera-params 525,525,319.5,239.5 --openmvs-bin /tmp/mvs-bin --blender-script tools/export_blender_scene.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-rgb-video-scene-${{ github.sha }}
          path: |
            video-result
            trial-source/input.json
            trial-source/input.mp4
