name: TUM RGB-MVS independent edge-support A/B

on:
  push:
    branches:
      - research/mvs-edge-crossview-geometry-20261029
    paths:
      - 'src/echo4d/known_pose_edge_crossview.py'
      - 'tools/tum_mvs_edge_crossview.py'
      - 'tools/tum_mvs_edge_crossview_diagnostic.py'
      - 'tests/python/test_known_pose_edge_crossview.py'
      - '.github/workflows/tum-mvs-edge-crossview-real-ab.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  real-mesh-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install --no-deps trimesh==4.11.1
      - name: Test independent geometric support and old-face preservation
        run: |
          python -m py_compile tools/tum_mvs_edge_crossview.py tools/tum_mvs_edge_crossview_diagnostic.py
          python -m pytest -q tests/python/test_known_pose_edge_crossview.py tests/python/test_known_pose_edge_extraction.py
      - name: Recover exact 48 RGB-inferred depth maps (not sensor Z)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/old
          gh run download 40692184301 --repo "$GITHUB_REPOSITORY" \
            --name tum-plane-sweep-crossview-ab-40692184301 \
            --dir "$RUNNER_TEMP/prior"
          cp -r "$RUNNER_TEMP/prior/old/." artifacts/old/
          test -s artifacts/old/inputs/recording.json
          test -s artifacts/old/reconstruction/mesh.ply
      - name: Download pinned original 640x480 RGB and measured poses
        env:
          PYTHONPATH: tools
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          from tum_public_roundtrip import download, extract
          root = Path(os.environ['RUNNER_TEMP']) / 'tum-crossview'
          root.mkdir()
          receipt = {}
          download(root / 'source.tgz', receipt)
          extract(root / 'source.tgz', root / 'dataset')
          print('SOURCE_SHA256', receipt['download']['sha256'])
          PY
      - name: Replay original and observed-edge Mesh, filter only new faces
        env:
          PYTHONPATH: tools
        run: |
          python tools/tum_mvs_edge_crossview.py \
            --old artifacts/old \
            --source-root "$RUNNER_TEMP/tum-crossview/dataset" \
            --target artifacts/new
          mkdir -p artifacts/comparison-old/reconstruction
          cp artifacts/new/unfiltered/reconstruction/mesh.ply artifacts/comparison-old/reconstruction/mesh.ply
          cp artifacts/new/unfiltered-comparison.json artifacts/comparison-old/report.json
      - name: Compare 3 original RGB same-camera poses plus 2 frozen free views
        env:
          PYTHONPATH: tools
        run: |
          python tools/tum_plane_sweep_compare.py \
            --old artifacts/comparison-old --new artifacts/new \
            --source-root "$RUNNER_TEMP/tum-crossview/dataset" \
            --output artifacts/frozen-five
      - name: Posthoc heldout sensor Z on removed vs retained pixels
        env:
          PYTHONPATH: tools
        run: |
          python tools/tum_mvs_edge_crossview_diagnostic.py \
            --old artifacts/comparison-old --new artifacts/new \
            --source-root "$RUNNER_TEMP/tum-crossview/dataset" \
            --output artifacts/heldout-diagnostic
      - name: Print actual geometry and visual verdict
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/new/report.json').read_text())
          c=json.loads(Path('artifacts/frozen-five/comparison.json').read_text())
          d=json.loads(Path('artifacts/heldout-diagnostic/diagnostic.json').read_text())
          print('NEW_TRIANGLES',r['new_mesh_summary']['triangles'])
          print('FACE_SUPPORT',r['face_support'])
          print('FIVE_VIEWS',[(v['view'],v['old_covered_pixels'],v['new_covered_pixels']) for v in c['views']])
          print('REMOVED_SENSOR_ERROR',[(x['heldout_index'],x['removed']) for x in d['heldout']])
          print('VISUAL_ACCEPTANCE',r['visual_acceptance'])
          PY
      - name: Preserve real PLY GLB source RGB five views and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tum-mvs-edge-crossview-ab-${{ github.run_id }}
          path: |
            artifacts/old/inputs/
            artifacts/old/reconstruction/mesh.ply
            artifacts/old/report.json
            artifacts/new/unfiltered/control-replayed.ply
            artifacts/comparison-old/report.json
            artifacts/new/unfiltered/report.json
            artifacts/new/unfiltered/reconstruction/mesh.ply
            artifacts/new/report.json
            artifacts/new/reconstruction/mesh.ply
            artifacts/frozen-five/
            artifacts/heldout-diagnostic/
          if-no-files-found: warn
          retention-days: 14
