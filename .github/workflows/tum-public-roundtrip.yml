name: public TUM RGB-D contract roundtrip

on:
  pull_request:
    paths:
      - 'tools/tum_public_roundtrip.py'
      - '.github/workflows/tum-public-roundtrip.yml'
      - 'src/echo4d/colmap.py'
      - 'src/echo4d/tum.py'
      - 'src/echo4d/model.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tum-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproducible-real-rgbd:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Pull official public data and compare COLMAP-format roundtrip
        env:
          ECHO_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/tum_public_roundtrip.py \
            --work "$RUNNER_TEMP/echo4d-tum-realdata" \
            --report-dir "$GITHUB_WORKSPACE/artifacts/tum-realdata"
      - name: Add experiment receipt to Actions summary
        if: always()
        run: |
          if [ -f artifacts/tum-realdata/SUMMARY.md ]; then
            cat artifacts/tum-realdata/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No report produced; inspect job logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload actual results and failure diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tum-realdata-contract-${{ github.run_id }}
          path: artifacts/tum-realdata/
          if-no-files-found: warn
          retention-days: 14
