name: Issue47 A real TUM indexed PNG depth roundtrip

on:
  pull_request:
    paths:
      - 'src/echo4d/colmap_indexed.py'
      - 'src/echo4d/cli.py'
      - 'tests/python/test_colmap_indexed.py'
      - 'tools/tum_indexed_depth_roundtrip.py'
      - '.github/workflows/issue47-a-indexed-real-tum.yml'
      - 'docs/ISSUE47_A_IMPORT.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue47-indexed-tum-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-raw-source-PNG-through-one-importer:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Record tested checkout
        run: echo "ECHO_TESTED_CHECKOUT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Check indexed unit, raw-path aliases, negative rollback
        run: |
          python -m pytest tests/python/test_colmap_indexed.py tests/python/test_colmap.py tests/python/test_colmap_cli.py -q
      - name: Pull pinned real TUM source and execute 16-bit PNG indexed path
        env:
          ECHO_TESTED_CHECKOUT_SHA: ${{ env.ECHO_TESTED_CHECKOUT_SHA }}
        run: |
          python tools/tum_indexed_depth_roundtrip.py \
            --work "$RUNNER_TEMP/issue47-a-real-indexed" \
            --report-dir "$GITHUB_WORKSPACE/artifacts/issue47-a-indexed"
      - name: Publish honest status even if earlier steps fail
        if: always()
        run: |
          if [ -f artifacts/issue47-a-indexed/SUMMARY.md ]; then
            cat artifacts/issue47-a-indexed/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No real-source result; see failed setup or tests." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Actual tested checkout: $ECHO_TESTED_CHECKOUT_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain numeric per-frame evidence and failure receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue47-a-indexed-real-tum-${{ github.run_id }}
          path: artifacts/issue47-a-indexed/
          if-no-files-found: warn
          retention-days: 14
