name: PR34 B paired same-input CFR PTS/FPS

on:
  pull_request:
    paths:
      - 'src/echo4d/video_sfm.py'
      - 'src/echo4d/video_pts.py'
      - 'tools/tum_pts_cfr_ab.py'
      - '.github/workflows/tum-video-pts-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tum-video-pts-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  same-video-colmap-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install bounded real FFmpeg and CPU COLMAP
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y -qq colmap ffmpeg
      - name: Install locked Python environment
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Test CFR/VFR decoded-frame time contracts
        run: python -m pytest tests/python/test_video_pts.py -q
      - name: Same pinned TUM MP4 through two real COLMAP modes
        env:
          ECHO_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/tum_pts_cfr_ab.py \
            --work "$RUNNER_TEMP/tum-pts-cfr-ab" \
            --report-dir "$GITHUB_WORKSPACE/artifacts/tum-pts-cfr-ab"
      - name: Record successful or failed evidence
        if: always()
        run: |
          if [ -f artifacts/tum-pts-cfr-ab/SUMMARY.md ]; then
            cat artifacts/tum-pts-cfr-ab/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No report emitted; consult job log.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload exact input SHA and per-view comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tum-pts-cfr-same-video-${{ github.run_id }}
          path: artifacts/tum-pts-cfr-ab/
          if-no-files-found: warn
          retention-days: 14
