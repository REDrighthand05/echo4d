name: TUM room RGB multiview inferred-depth coherence A/B

on:
  push:
    branches:
      - research/room-multiview-depth-coherence-20261029
    paths:
      - 'tools/tum_room_multiview_coherence.py'
      - 'tests/python/test_tum_room_multiview_coherence.py'
      - '.github/workflows/tum-room-multiview-coherence.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: room-multiview-coherence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-room-coherence:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install CPU reconstruction dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install 'open3d==0.19.0' 'opencv-python-headless==4.12.0.88' 'trimesh==4.11.1'
      - name: Check coherence and original multiview regression
        env:
          PYTHONPATH: tools
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -m py_compile tools/tum_room_multiview_coherence.py
          python -m pytest -q tests/python/test_tum_room_multiview_coherence.py tests/python/test_tum_room_knownpose_multiview.py
      - name: Recover frozen measured, stereo, and previous multiview real Mesh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/room-highinfo" "$RUNNER_TEMP/room-stereo" "$RUNNER_TEMP/room-old-multiview"
          gh run download 40750777392 --repo "$GITHUB_REPOSITORY" --name tum-room-dense-120-40750777392 --dir "$RUNNER_TEMP/room-highinfo"
          gh run download 40759191600 --repo "$GITHUB_REPOSITORY" --name tum-room-rgb-stereo-ablation-40759191600 --dir "$RUNNER_TEMP/room-stereo"
          gh run download 40769461870 --repo "$GITHUB_REPOSITORY" --name tum-room-knownpose-multiview-40769461870 --dir "$RUNNER_TEMP/room-old-multiview"
          test -s "$RUNNER_TEMP/room-highinfo/room-96-fine-wide/mesh.ply"
          test -s "$RUNNER_TEMP/room-stereo/rgb-stereo-mesh/mesh.ply"
          test -s "$RUNNER_TEMP/room-old-multiview/multiview-mesh/mesh.ply"
      - name: Run real 96-pose TUM room inferred-depth coherence and frozen 3+2 A/B
        env:
          PYTHONPATH: tools
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          ECHO_PREVIOUS_MULTIVIEW: ${{ runner.temp }}/room-old-multiview
        run: |
          python tools/tum_room_multiview_coherence.py \
            --work "$RUNNER_TEMP/tum-room-coherence" \
            --baseline "$RUNNER_TEMP/room-highinfo" \
            --stereo "$RUNNER_TEMP/room-stereo" \
            --report-dir "$GITHUB_WORKSPACE/artifacts/room-coherence"
      - name: Print actual status, not visual PASS
        if: always()
        run: |
          if [ -f artifacts/room-coherence/report.json ]; then
            python - <<'PY'
          import json
          r=json.load(open('artifacts/room-coherence/report.json'))
          print('STATUS',r.get('status'),'ERROR',r.get('error'))
          print('MESH',r.get('new_mesh'),'ISSUE74',r.get('issue_74'))
          print('OLD_VS_NEW_VIEWS',r.get('visual_old_vs_coherent'))
          PY
          fi
      - name: Retain original RGB, real old/new GLBs, Mesh, 3+2 images and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tum-room-multiview-coherence-${{ github.run_id }}
          path: artifacts/room-coherence/
          if-no-files-found: warn
          retention-days: 14
