name: Hi3D CPU geometry contract (not model inference)

on:
  pull_request:
    paths:
      - 'tools/hi3d_geometry_gate.py'
      - 'tools/bounded_numeric_npz.py'
      - 'tests/python/test_bounded_numeric_npz.py'
      - 'tests/python/test_hi3d_sampling_invariance.py'
      - 'tests/python/test_hi3d_geometry_gate.py'
      - 'docs/HI3D_RESEARCH.md'
      - '.github/workflows/hi3d-geometry-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ECHO pinned CPU dependencies
        run: python -m pip install -r requirements.lock
      - name: Synthetic geometry and invalid-data tests, not Hi3D inference
        env:
          PYTHONPATH: tools
        run: python -m pytest tests/python/test_hi3d_geometry_gate.py tests/python/test_hi3d_sampling_invariance.py tests/python/test_bounded_numeric_npz.py -q
      - name: Evidence boundary
        shell: bash
        run: |
          echo 'Only CPU synthetic tests; no Hi3D model or real room accuracy proven.' >> "$GITHUB_STEP_SUMMARY"
