name: Stanford measured RGB-D gap patch A/B
on:
  push:
    branches: [research/stanford-measured-gap-patches-20261029]
    paths:
      - tools/stanford_measured_gap_patches.py
      - .github/workflows/stanford-measured-gap-patches.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  measured-gap-patches:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: isl-org/Open3D
          ref: 1e7b17438687a0b0c1e5a7187321ac7044afe275
          path: vendor/Open3D
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned measured-geometry dependencies
        run: |
          python -m pip install 'open3d==0.19.0' 'trimesh==4.11.1' 'numpy<3' pillow scipy
          python -m py_compile tools/stanford_measured_gap_patches.py
          curl -fLsS 'https://raw.githubusercontent.com/REDrighthand05/echo4d/1a487a33592e08dde351047583ff3603804f9f1e/tools/stanford_full_observed_speck_cleanup.py' -o tools/stanford_full_observed_speck_cleanup.py
          python -m py_compile tools/stanford_full_observed_speck_cleanup.py
      - name: Fetch original full observed RGB-D reconstruction (no prior scan)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40877823227 --repo "$GITHUB_REPOSITORY" --name official-room-recovered-40877823227 --dir "$RUNNER_TEMP/full-room"
          test -s "$RUNNER_TEMP/full-room/scene/integrated.ply"
          test -s "$RUNNER_TEMP/full-room/scene/trajectory.log"
          test -s "$RUNNER_TEMP/full-room/views/recorded-00000.png"
      - name: Build independently corroborated measured-depth local patches
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python tools/stanford_measured_gap_patches.py \
            --source "$RUNNER_TEMP/full-room" \
            --upstream vendor/Open3D \
            --output artifacts/stanford-measured-gap-patches
      - name: Preserve colored GLBs and same-camera five-view comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stanford-measured-gap-patches-${{ github.run_id }}
          path: artifacts/stanford-measured-gap-patches/
          retention-days: 30
          if-no-files-found: warn
