name: Real Fountain 16 sensor + 8 RGB multi-view guard, 3+2 Mesh A/B
on:
  push:
    branches: [research/fountain-rgb8-multiview-guard-20261031]
    paths:
      - tools/fountain_rgb_visibility_guard.py
      - tests/python/test_fountain_rgb_visibility_guard.py
      - .github/workflows/fountain-rgb8-multiview-guard.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fountain-rgb8-multiview-guard
  cancel-in-progress: false

jobs:
  fountain-real-rgb-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing geometry and regression dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install 'open3d==0.19.0' 'trimesh==4.11.1' 'pytest==8.4.2'
      - name: Run geometric visibility and original sensor calibration regressions
        env:
          PYTHONPATH: tools
        run: |
          python -m py_compile tools/fountain_rgb_visibility_guard.py
          python -m pytest -q tests/python/test_fountain_rgb_visibility_guard.py tests/python/test_fountain_cpu_rgb_depth8.py
      - name: Install pinned CPU Depth Anything V2 Small runtime
        run: |
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.53.3' 'huggingface_hub==0.34.4'
      - name: Generate original and guarded RGB depths and actual four colored GLBs
        env:
          PYTHONPATH: tools
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'
          QT_QPA_PLATFORM: offscreen
          HF_HUB_DISABLE_XET: '1'
        run: |
          python tools/fountain_rgb_visibility_guard.py \
            --work "$RUNNER_TEMP/fountain-rgb-guard" \
            --output "$GITHUB_WORKSPACE/artifacts/fountain-rgb-guard"
      - name: Reopen GLBs and validate five fixed cameras
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          import trimesh
          p = Path("artifacts/fountain-rgb-guard")
          r = json.loads((p/"result.json").read_text())
          assert r["status"] == "four_real_glbs_and_five_views_visual_review_pending", r
          assert len(r["measured_sensor_indices"]) == 16
          assert len(r["rgb_only_indices"]) == 8
          assert len(r["holdout_indices"]) == 9
          assert not set(r["measured_sensor_indices"]) & set(r["rgb_only_indices"])
          assert r["target_sensor_depth_used_in_reconstruction"] is False
          assert r["supplied_scan_prior_used"] is False
          assert len([x for x in r["predictions"] if x["used"]]) >= 3
          assert len(r["views"]) == 5 and len(r["meshes"]) == 4
          for m in r["meshes"].values():
              mesh = trimesh.load(str(p/m["glb"]), force="mesh", process=False)
              assert len(mesh.faces) > 1000 and mesh.visual.kind == "vertex"
          assert len(list(p.glob("source-*-native.png"))) == 3
          assert Image.open(p/"fountain-original-vs-multiview-guard-five-views.png").size == (1600,1335)
          PY
      - name: Preserve actual GLBs, native photos, depth maps and five-view A/B
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fountain-rgb8-multiview-guard-real-mesh
          path: artifacts/fountain-rgb-guard/
          if-no-files-found: warn
          retention-days: 30
