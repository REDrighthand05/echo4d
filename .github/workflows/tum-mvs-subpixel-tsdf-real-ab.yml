name: TUM frozen RGB-MVS subpixel TSDF Mesh A/B

on:
  push:
    branches:
      - research/mvs-subpixel-tsdf-20261028
    paths:
      - 'src/echo4d/known_pose_subpixel_fusion.py'
      - 'tools/tum_mvs_subpixel_tsdf_replay.py'
      - 'tests/python/test_known_pose_subpixel_fusion.py'
      - '.github/workflows/tum-mvs-subpixel-tsdf-real-ab.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  real-mesh-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked ECHO and GLB exporter
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install --no-deps trimesh==4.11.1
      - name: Test original camera rays, zero support, depth edges
        run: |
          python -m pytest -q tests/python/test_known_pose_subpixel_fusion.py
      - name: Recover exact frozen old inferred Z and control Mesh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/old
          gh run download 40692184301 --repo "$GITHUB_REPOSITORY" \
            --name tum-plane-sweep-crossview-ab-40692184301 \
            --dir "$RUNNER_TEMP/prior"
          cp -r "$RUNNER_TEMP/prior/old/." artifacts/old/
          test -s artifacts/old/reconstruction/mesh.ply
          test -s artifacts/old/inputs/recording.json
      - name: Download pinned original TUM RGB and poses (no sensor-Z opened)
        env:
          PYTHONPATH: tools
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          from tum_public_roundtrip import download, extract
          root = Path(os.environ['RUNNER_TEMP']) / 'tum-subpixel'
          root.mkdir()
          receipt = {}
          download(root / 'source.tgz', receipt)
          extract(root / 'source.tgz', root / 'dataset')
          print('PINNED_ARCHIVE_SHA256', receipt['download']['sha256'])
          PY
      - name: Actual 48-frame subpixel TSDF Mesh from frozen RGB-inferred Z
        env:
          PYTHONPATH: tools
        run: |
          python tools/tum_mvs_subpixel_tsdf_replay.py \
            --old artifacts/old \
            --source-root "$RUNNER_TEMP/tum-subpixel/dataset" \
            --target artifacts/new
      - name: Three original 640x480 photos and five identical old/new Mesh views
        env:
          PYTHONPATH: tools
        run: |
          python tools/tum_plane_sweep_compare.py \
            --old artifacts/old --new artifacts/new \
            --source-root "$RUNNER_TEMP/tum-subpixel/dataset" \
            --output artifacts/frozen-five
          python - <<'PY'
          import json
          from pathlib import Path
          old = json.loads(Path('artifacts/old/report.json').read_text())
          new = json.loads(Path('artifacts/new/report.json').read_text())
          comparison = json.loads(Path('artifacts/frozen-five/comparison.json').read_text())
          print('OLD_MESH', old.get('mesh_sha256'))
          print('NEW_MESH', new['mesh_sha256'])
          print('COVERAGE', [(v['view'],v['old_covered_pixels'],v['new_covered_pixels']) for v in comparison['views']])
          print('INTERPOLATED_SAMPLES_NOT_NEW_MEASUREMENTS',new['interpolated_subpixel_samples_not_new_measurements'])
          print('VISUAL_ACCEPTANCE',new['visual_acceptance'])
          PY
      - name: Preserve real Mesh, GLB, three original RGB photos and five frozen views
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tum-mvs-subpixel-tsdf-ab-${{ github.run_id }}
          path: |
            artifacts/new/reconstruction/
            artifacts/new/report.json
            artifacts/new/visual/
            artifacts/frozen-five/
          if-no-files-found: warn
          retention-days: 14
