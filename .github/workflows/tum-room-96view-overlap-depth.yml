name: Real TUM room 96-view RGB overlap depth ablation

on:
  push:
    branches:
      - research/room96-frustum-overlap-depth-20261029
    paths:
      - 'tools/tum_room_pose_overlap_neighbors.py'
      - 'tools/tum_room_pose_overlap_preflight.py'
      - 'tools/tum_room_96view_da2_overlap_run.py'
      - 'tests/python/test_tum_room_pose_overlap_neighbors.py'
      - '.github/workflows/tum-room-96view-overlap-depth.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: room-96-overlap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-room-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install same CPU depth model and real Open3D fusion as prior run
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install 'open3d==0.19.0' 'opencv-python-headless==4.12.0.88' 'trimesh==4.11.1'
          python -m pip install 'torch==2.5.1+cpu' 'torchvision==0.20.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.48.3' 'huggingface_hub==0.29.3' 'safetensors==0.5.3'
      - name: CPU tests, original 96-view isolation regressions
        env:
          PYTHONPATH: tools:src
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'
        run: |
          python -m py_compile tools/tum_room_pose_overlap_neighbors.py tools/tum_room_pose_overlap_preflight.py tools/tum_room_96view_da2_overlap_run.py
          python -m pytest -q tests/python/test_tum_room_pose_overlap_neighbors.py tests/python/test_tum_room_96view_da2_complete.py tests/python/test_tum_room_96view_da2_ablation.py
      - name: Recover frozen real source RGB and 30 previously inferred DA2 frames
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/room-source"
          gh run download 40790769632 --repo "$GITHUB_REPOSITORY" --name tum-room-da2-consensus-40790769632 --dir "$RUNNER_TEMP/room-source"
          test -s "$RUNNER_TEMP/room-source/replay-inputs/source/recording.json"
          test -s "$RUNNER_TEMP/room-source/replay-inputs/source/association.json"
          test -s "$RUNNER_TEMP/room-source/replay-inputs/inferred/recording.json"
      - name: Real 96 camera frustum overlap preflight (no sensor pixels)
        env:
          PYTHONPATH: tools:src
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python tools/tum_room_pose_overlap_preflight.py --source "$RUNNER_TEMP/room-source" --output "$RUNNER_TEMP/room96-overlap-preflight.json"
      - name: Real CPU DA2 0/32/64/96 measured-depth ladder, fixed 96 RGB and poses
        env:
          PYTHONPATH: tools:src
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'
          HF_HUB_DOWNLOAD_TIMEOUT: '120'
          HF_HUB_ETAG_TIMEOUT: '120'
        run: |
          python tools/tum_room_96view_da2_overlap_run.py --source "$RUNNER_TEMP/room-source" --work "$RUNNER_TEMP/room96-overlap-work" --output "$GITHUB_WORKSPACE/artifacts/room96-overlap"
      - name: Retain per-pixel candidate predictions for independent replay
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/room96-overlap-preflight.json" ]; then
            mkdir -p artifacts/room96-overlap
            cp "$RUNNER_TEMP/room96-overlap-preflight.json" artifacts/room96-overlap/preflight.json
          fi
          if [ -f "$RUNNER_TEMP/room96-overlap-work/predicted-96/recording.json" ]; then
            mkdir -p artifacts/room96-overlap/replay
            cp -a "$RUNNER_TEMP/room96-overlap-work/predicted-96" artifacts/room96-overlap/replay/
            find artifacts/room96-overlap/replay/predicted-96 -type f -print0 | sort -z | xargs -0 sha256sum > artifacts/room96-overlap/replay/sha256sums.txt
          fi
          if [ -f artifacts/room96-overlap/report.json ]; then
            python - <<'PY'
          import json
          r=json.load(open('artifacts/room96-overlap/report.json'))
          p=r.get('prediction',{})
          print('INFERENCE_ACTUALLY_EXECUTED',p.get('new_cpu_inference_frames'))
          print('NO_TWO_WITNESSES',p.get('skipped_no_two_neighbors'))
          print('NONEMPTY_PREDICTIONS',p.get('predicted_nonempty_frames'))
          print('MESH_LEVELS',{k:(v.get('status'),v.get('faces')) for k,v in r.get('levels',{}).items()})
          print('ISSUE74',r.get('issue_74'))
          PY
          fi
      - name: Preserve real Mesh GLB/PLY, 3+2 renders, original prediction maps and FAIL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tum-room-96-overlap-depth-${{ github.run_id }}
          path: artifacts/room96-overlap/
          if-no-files-found: warn
          retention-days: 14
