name: Attach release package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach to (e.g. v0.3)"
        required: true
      build_run:
        description: "build-windows-exe run id holding the artifacts"
        required: true
  push:
    branches: [product/echo-scene]
    paths: [.github/workflows/release-attach.yml]

permissions:
  actions: read
  contents: write

jobs:
  attach:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download built artifacts from the build run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.build_run }}" --repo "$GITHUB_REPOSITORY" --dir dl
          echo "--- dl contents ---"
          find dl -type f -exec ls -la {} \;

      - name: Locate package files
        run: |
          INNER=$(find dl -name 'EchoScene-windows.zip' | head -n 1)
          if [ -z "$INNER" ]; then
            OUTER=$(find dl -name '*.zip' ! -name 'EchoScene-Setup*' | head -n 1)
            echo "outer zip: $OUTER"
            mkdir -p out
            unzip -o "$OUTER" -d out
            INNER=$(find out -name 'EchoScene-windows.zip' | head -n 1)
          fi
          echo "inner zip: $INNER"
          test -n "$INNER"
          cp "$INNER" ./EchoScene-windows.zip
          SETUP=$(find dl out -name 'EchoScene-Setup.exe' 2>/dev/null | head -n 1)
          echo "setup exe: $SETUP"
          test -n "$SETUP"
          cp "$SETUP" ./EchoScene-Setup.exe
          ls -la ./EchoScene-windows.zip ./EchoScene-Setup.exe

      - name: Verify inner zip contains EchoScene/EchoScene.exe
        run: |
          python3 - <<'EOF'
          import zipfile
          z = zipfile.ZipFile("EchoScene-windows.zip")
          names = z.namelist()
          print(f"entries: {len(names)}")
          assert "EchoScene/EchoScene.exe" in names, "EchoScene/EchoScene.exe missing from inner zip"
          print("OK: EchoScene/EchoScene.exe present")
          EOF

      - name: Upload packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" EchoScene-windows.zip EchoScene-Setup.exe --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify assets present on release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" --json assets
