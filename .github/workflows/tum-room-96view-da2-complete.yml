name: TUM room 96 RGB views complete DA2 CPU sensor-depth ladder

on:
  push:
    branches:
      - research/room-96view-complete-da2-ladder-20261029
    paths:
      - 'tools/tum_room_96view_da2_complete.py'
      - 'tests/python/test_tum_room_96view_da2_complete.py'
      - '.github/workflows/tum-room-96view-da2-complete.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: room-96-complete-da2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-room-96-complete:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned CPU inference and existing Open3D fusion
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install 'open3d==0.19.0' 'opencv-python-headless==4.12.0.88' 'trimesh==4.11.1'
          python -m pip install 'torch==2.5.1+cpu' 'torchvision==0.20.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.48.3' 'huggingface_hub==0.29.3' 'safetensors==0.5.3'
      - name: Test no-sensor 96-frame inference and frozen selection
        env:
          PYTHONPATH: tools:src
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'
        run: |
          python -m py_compile tools/tum_room_96view_da2_complete.py
          python -m pytest -q tests/python/test_tum_room_96view_da2_complete.py tests/python/test_tum_room_96view_da2_ablation.py tests/python/test_tum_room_depthanything_small.py
      - name: Recover frozen SHA-verified 96 RGB and 30 real DA2 CPU predictions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/room-source"
          gh run download 40790769632 --repo "$GITHUB_REPOSITORY" \
            --name tum-room-da2-consensus-40790769632 --dir "$RUNNER_TEMP/room-source"
          test -s "$RUNNER_TEMP/room-source/replay-inputs/ledger.json"
          test -s "$RUNNER_TEMP/room-source/replay-inputs/source/recording.json"
          test -s "$RUNNER_TEMP/room-source/replay-inputs/inferred/recording.json"
      - name: Infer 66 remaining real RGB views on CPU, then 0/32/64/96 measured-Z Mesh
        env:
          PYTHONPATH: tools:src
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'
          HF_HUB_DOWNLOAD_TIMEOUT: '120'
          HF_HUB_ETAG_TIMEOUT: '120'
        run: |
          python tools/tum_room_96view_da2_complete.py \
            --source "$RUNNER_TEMP/room-source" \
            --work "$RUNNER_TEMP/room-96-complete-work" \
            --output "$GITHUB_WORKSPACE/artifacts/room-96-complete"
      - name: Print actual source counts and real Mesh status
        if: always()
        run: |
          if [ -f artifacts/room-96-complete/report.json ]; then
            python - <<'PY'
          import json
          r=json.load(open('artifacts/room-96-complete/report.json'))
          print('MODEL',r.get('model'),r.get('checkpoint_sha256'))
          print('PREDICTION',r.get('prediction',{}).get('predicted_nonempty_frames'))
          for level,value in r.get('levels',{}).items():
              print('SENSOR_FRAMES',level,'STATUS',value.get('status'),
                    'FACES',value.get('faces'),'ERROR',value.get('error'))
          print('ISSUE74',r.get('issue_74'))
          PY
          fi
      - name: Preserve actual 0/32/64/96 GLBs, 3+2 PNGs and failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tum-room-96-complete-da2-${{ github.run_id }}
          path: artifacts/room-96-complete/
          if-no-files-found: warn
          retention-days: 14
