name: PR12 vs PR13 frozen same-video RGB SfM

on:
  pull_request:
    paths:
      - 'src/echo4d/video_sfm.py'
      - 'tests/python/test_video_sfm_models.py'
      - 'tools/tum_video_pr12_pr13_ab.py'
      - '.github/workflows/tum-video-pr12-pr13-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tum-pr12-pr13-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paired-real-colmap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch frozen PR13 source for read-only comparison
        uses: actions/checkout@v4
        with:
          ref: dd1b4be5d8b85b4bdf1fe11661876c8e15d0cdb0
          path: pr13-checkout
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install bounded FFmpeg and CPU COLMAP
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y -qq colmap ffmpeg
          colmap help
      - name: Install frozen Python dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Fail-closed model and downstream format tests
        run: python -m pytest tests/python/test_video_sfm.py tests/python/test_video_sfm_models.py tests/python/test_metric_anchor.py tests/python/test_metric_rgbd.py -q
      - name: Run fixed identical TUM video with both real COLMAP pipelines
        env:
          ECHO_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/tum_video_pr12_pr13_ab.py \
            --work "$RUNNER_TEMP/tum-pr12-pr13" \
            --report-dir "$GITHUB_WORKSPACE/artifacts/pr12-pr13-ab" \
            --pr13-source "$GITHUB_WORKSPACE/pr13-checkout/src"
      - name: Record actual PASS or FAIL
        if: always()
        run: |
          if [ -f artifacts/pr12-pr13-ab/report.json ]; then
            python - <<'PY'
          import json, pathlib, os
          obj=json.loads(pathlib.Path('artifacts/pr12-pr13-ab/report.json').read_text())
          summary=("# PR #12 / #13 same-video comparison\n"
                   f"Status: {obj.get('status')}\n\n"
                   f"Input hashes identical: {obj.get('same_input',{}).get('matching_image_sha256_by_index','NOT_MEASURED')}\n\n"
                   f"Registered: { {k:v.get('registration_count') for k,v in obj.get('comparison',{}).items()} }\n\n"
                   f"Failure: {obj.get('failure')}\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out: out.write(summary)
          PY
          else
            echo 'No machine report emitted; job failed before experiment.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload raw machine results and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tum-pr12-pr13-paired-${{ github.run_id }}
          path: artifacts/pr12-pr13-ab/
          if-no-files-found: warn
          retention-days: 14
