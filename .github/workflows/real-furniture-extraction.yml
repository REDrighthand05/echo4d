name: Real ECHO furniture evidence and fallback audit

on:
  pull_request:
    paths:
      - 'tools/real_furniture_extract.py'
      - 'tools/real_furniture_scene_trial.py'
      - 'tests/python/test_real_furniture_extract.py'
      - 'docs/REAL_FURNITURE_EXTRACTION.md'
      - '.github/workflows/real-furniture-extraction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  furniture-evidence-CPU:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install ECHO locked core plus reused trimesh mesh I/O
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install trimesh==4.11.1
      - name: Run rigid pose, real unit, 2-view mask/depth and no-overwrite regression
        env:
          PYTHONPATH: tools
        run: python -m pytest -q tests/python/test_real_furniture_extract.py tests/python/test_hi3d_candidate_intake.py
      - name: Audit both immutable ECHO real static scenes and public chair RGB-D
        run: |
          python tools/real_furniture_scene_trial.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --out "$GITHUB_WORKSPACE/artifacts/real-furniture-trial" \
            --fetch-public-fallback
      - name: Show real outcome including blocked cases
        if: always()
        run: |
          if [ -f artifacts/real-furniture-trial/SUMMARY.md ]; then
            cat artifacts/real-furniture-trial/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Real-data input step not reached; consult failed job logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve raw real-scene audit, source hashes and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-furniture-evidence-${{ github.run_id }}
          path: artifacts/real-furniture-trial/
          retention-days: 21
          if-no-files-found: warn
