name: Stanford Lounge RGB-SfM consistency filter on two cached DA V2 depths
on:
  push:
    branches: [research/stanford-colmap300-da2-track-filter-20261030]
    paths:
      - tools/stanford_colmap_da2_track_filter.py
      - .github/workflows/stanford-colmap-da2-track-filter.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stanford-colmap-da2-track-filter
  cancel-in-progress: false
jobs:
  real-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch frozen original 300 RGB and independent COLMAP model
        uses: actions/download-artifact@v4
        with:
          name: stanford-300rgb-early-overlap-30depth-40970565394
          run-id: 40970565394
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: REDrighthand05/echo4d
          path: artifacts/early-colmap
      - name: Fetch original eight-measured control (comparison only)
        uses: actions/download-artifact@v4
        with:
          name: stanford-eight-measured-control-41000309095
          run-id: 41000309095
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: REDrighthand05/echo4d
          path: artifacts/eight-measured-control
      - name: Fetch two previously CPU-inferred DA V2 depth maps and GLB
        uses: actions/download-artifact@v4
        with:
          name: stanford-eight-da2-41011113006
          run-id: 41011113006
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: REDrighthand05/echo4d
          path: artifacts/da2
      - name: Install pinned CPU geometry dependencies and test filter
        run: |
          python -m pip install 'open3d==0.19.0' 'trimesh==4.11.1' 'pillow==11.3.0' 'scipy==1.16.2' 'scikit-image==0.25.2' 'opencv-python-headless==4.12.0.88'
          python -m pip install --no-deps -e .
          python -m py_compile tools/stanford_colmap_da2_track_filter.py
          python tools/stanford_colmap_da2_track_filter.py --self-test
      - name: Reject contradicted predicted patches and re-fuse actual room Mesh
        env:
          QT_QPA_PLATFORM: offscreen
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python tools/stanford_colmap_da2_track_filter.py \
            --upstream artifacts/early-colmap \
            --control artifacts/eight-measured-control \
            --da2 artifacts/da2 \
            --output artifacts/da2-track-filter
      - name: Confirm fresh GLB, five actual views and held-out sensor evaluation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/da2-track-filter')
          r=json.loads((p/'receipt.json').read_text())
          assert r['status']=='REAL_MESH_GENERATED_VISUAL_REVIEW_REQUIRED',r
          assert r['input_rgb']==300 and r['registered_rgb']==287
          assert r['measured_depth_maps']==8 and r['inferred_depth_maps']==2
          assert not r['prior_mesh'] and not r['ground_truth_poses'] and not r['gpu']
          assert len(r['heldout_evaluation'])==2
          for name in ('measured8_da2_track_filtered.glb','source-da2-vs-track-filtered-3plus2.png'):
              assert (p/name).stat().st_size>10000,name
          print(json.dumps(r,indent=2))
          PY
      - name: Keep real Mesh, 3 recorded + 2 free views and failure receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stanford-da2-track-filter-${{ github.run_id }}
          path: |
            artifacts/da2-track-filter/receipt.json
            artifacts/da2-track-filter/*.glb
            artifacts/da2-track-filter/*.png
          if-no-files-found: warn
          retention-days: 30
