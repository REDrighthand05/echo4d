name: public TUM RGB-only CPU COLMAP SfM

on:
  pull_request:
    paths:
      - 'src/echo4d/video_sfm.py'
      - 'src/echo4d/sfm_evaluation.py'
      - 'tools/tum_video_sfm.py'
      - 'tests/python/test_sfm_evaluation.py'
      - '.github/workflows/tum-video-sfm.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tum-video-sfm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-rgb-sfm:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      QT_QPA_PLATFORM: offscreen
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual FFmpeg and COLMAP executables
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg colmap
          ffmpeg -version | head -n 1
          colmap -h | head -n 12
      - name: Install pinned Python dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Run real TUM encoded-video-only pose estimation then held-out scoring
        env:
          ECHO_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/tum_video_sfm.py \
            --work "$RUNNER_TEMP/tum-video-sfm" \
            --report-dir "$GITHUB_WORKSPACE/artifacts/tum-video-sfm"
      - name: Publish outcome, including failure
        if: always()
        run: |
          if test -f artifacts/tum-video-sfm/SUMMARY.md; then
            cat artifacts/tum-video-sfm/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No experiment report produced; see job logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve independent scores and failure receipts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-tum-video-sfm-${{ github.run_id }}
          path: artifacts/tum-video-sfm/
          if-no-files-found: warn
          retention-days: 14
